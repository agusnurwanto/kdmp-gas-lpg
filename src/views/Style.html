<style>
  :root {
    --primary: #DC2626;
    --primary-hover: #B91C1C;
    --primary-light: #FEE2E2;
    --secondary: #0F172A;
    --accent: #0284C7;
    --accent-light: #E0F2FE;
    --success: #16A34A;
    --success-light: #DCFCE7;
    --warning: #D97706;
    --warning-light: #FEF3C7;
    --danger: #EF4444;
    --bg-page: #F8FAFC;
    --bg-surface: #FFFFFF;
    --text-main: #0F172A;
    --text-muted: #64748B;
    --border-color: #E2E8F0;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* App Layout */
  .app-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px;
  }

  /* Navbar */
  .navbar {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-badge {
    background: var(--primary);
    color: white;
    font-weight: 700;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: var(--radius-md);
    letter-spacing: 0.5px;
    box-shadow: 0 2px 4px rgba(220, 38, 38, 0.25);
  }

  .brand-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--secondary);
    line-height: 1.2;
  }

  .brand-subtitle {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* Navigation Tabs */
  .nav-tabs {
    display: flex;
    gap: 8px;
    background: #F1F5F9;
    padding: 4px;
    border-radius: var(--radius-md);
  }

  .tab-btn {
    border: none;
    background: transparent;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .tab-btn.active {
    background: var(--bg-surface);
    color: var(--primary);
    box-shadow: var(--shadow-sm);
  }

  .tab-btn:hover:not(.active) {
    color: var(--secondary);
  }

  /* Tab Panes */
  .tab-pane {
    display: none;
  }

  .tab-pane.active {
    display: block;
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* KPI Cards Grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }

  .kpi-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .kpi-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .kpi-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .kpi-value {
    font-size: 28px;
    font-weight: 800;
    color: var(--secondary);
    margin: 8px 0 4px 0;
  }

  .kpi-desc {
    font-size: 12px;
    color: var(--text-muted);
  }

  .kpi-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge-primary { background: var(--primary-light); color: var(--primary); }
  .badge-success { background: var(--success-light); color: var(--success); }
  .badge-warning { background: var(--warning-light); color: var(--warning); }
  .badge-accent { background: var(--accent-light); color: var(--accent); }

  /* Section Header & Toolbar */
  .toolbar {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-sm);
  }

  .toolbar-left, .toolbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* Form Elements */
  .input-text, .select-control {
    padding: 8px 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 14px;
    outline: none;
    background: #FAFAFA;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .input-text:focus, .select-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px var(--primary-light);
    background: white;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--primary);
    color: white;
  }
  .btn-primary:hover {
    background: var(--primary-hover);
  }

  .btn-success {
    background: var(--success);
    color: white;
  }
  .btn-success:hover {
    background: #15803D;
  }

  .btn-outline {
    background: white;
    border-color: var(--border-color);
    color: var(--secondary);
  }
  .btn-outline:hover {
    background: #F1F5F9;
  }

  .btn-sm {
    padding: 4px 8px;
    font-size: 12px;
    border-radius: var(--radius-sm);
  }

  /* Queue Cards Grid */
  .queue-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 14px;
  }

  .queue-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    transition: border-color 0.2s ease;
  }

  .queue-card.status-sudah {
    border-left: 4px solid var(--success);
    background: #F0FDF4;
  }
  .queue-card.status-menunggu {
    border-left: 4px solid var(--accent);
  }
  .queue-card.status-digantikan {
    border-left: 4px solid var(--warning);
    background: #FFFBEB;
  }
  .queue-card.status-batal {
    border-left: 4px solid var(--danger);
    opacity: 0.7;
  }

  .queue-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .queue-number {
    font-size: 14px;
    font-weight: 800;
    background: var(--secondary);
    color: white;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .queue-card.status-sudah .queue-number {
    background: var(--success);
  }

  .queue-member-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--secondary);
    margin-bottom: 2px;
  }

  .queue-member-sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  .queue-replaced-info {
    font-size: 11px;
    background: #FEF3C7;
    color: #92400E;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    margin: 6px 0;
    line-height: 1.3;
  }

  .queue-actions {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border-color);
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }

  /* Table Style */
  .table-container {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 13px;
  }

  .data-table th {
    background: #F8FAFC;
    padding: 12px 16px;
    font-weight: 700;
    color: var(--secondary);
    border-bottom: 1px solid var(--border-color);
  }

  .data-table td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-main);
  }

  .data-table tr:hover td {
    background: #F8FAFC;
  }

  /* Modals */
  .modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s ease;
  }

  .modal-backdrop.show {
    opacity: 1;
    visibility: visible;
  }

  .modal-dialog {
    background: var(--bg-surface);
    border-radius: var(--radius-lg);
    width: 90%;
    max-width: 500px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    transform: translateY(10px);
    transition: transform 0.2s ease;
  }

  .modal-backdrop.show .modal-dialog {
    transform: translateY(0);
  }

  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--secondary);
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--text-muted);
  }

  .modal-body {
    padding: 20px;
  }

  .modal-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border-color);
    background: #F8FAFC;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .form-group {
    margin-bottom: 14px;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--secondary);
    margin-bottom: 6px;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--secondary);
    color: white;
    padding: 12px 20px;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2000;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s ease;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  /* Print view */
  @media print {
    .navbar, .toolbar, .nav-tabs, .btn, .modal-backdrop {
      display: none !important;
    }
    .app-container {
      max-width: 100% !important;
      padding: 0 !important;
    }
    .queue-grid {
      grid-template-columns: repeat(2, 1fr) !important;
    }
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .navbar {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .nav-tabs {
      width: 100%;
      overflow-x: auto;
    }
    .toolbar {
      flex-direction: column;
      align-items: stretch;
    }
    .toolbar-left, .toolbar-right {
      justify-content: space-between;
    }
  }
</style>
