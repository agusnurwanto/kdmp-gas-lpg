<script>
  // State Global Frontend
  let currentBatches = [];
  let currentQueue = [];
  let allMembersCache = [];
  let selectedMapMemberId = "";
  let mapMemberOptions = [];
  let mapMemberActiveIndex = -1;
  let replaceMemberId = "";
  let replaceCurrentMemberId = "";
  let bulkReplaceState = null;
  let bulkPickupContext = null;
  let memberSort = { key: "nama_lengkap", direction: 1 };
  let reportSort = { key: "priority", direction: 1 };
  let selectedBatchId = "";
  let publicQueueCache = [];
  let publicQueueCacheBatchId = "";
  let publicQueueRequestId = 0;
  let isAdmin = false;
  let isHandlingExpiredSession = false;
  let salesImportState = null;
  let activeServerRequests = 0;
  let settingsCacheTimer = null;
  let localLogoPreviewUrl = "";
  let disabledButtonsDuringRequest = [];
  let appSettingsLoaded = false;
  let adminDataLoaded = false;

  const SETTINGS_CACHE_KEY = "KDMP_APP_SETTINGS_V1";
  const SETTINGS_CACHE_TTL = 10 * 60 * 1000;

  function beginServerRequest() {
    if (activeServerRequests === 0) {
      const buttons = document.querySelectorAll(".app-container button");
      disabledButtonsDuringRequest = [];
      buttons.forEach(function (button) {
        disabledButtonsDuringRequest.push({ button: button, wasDisabled: button.disabled });
        button.disabled = true;
      });
    }
    activeServerRequests++;
    if (settingsCacheTimer) {
      clearTimeout(settingsCacheTimer);
      settingsCacheTimer = null;
    }
    const overlay = document.getElementById("app-loading-overlay");
    if (overlay) overlay.classList.add("show");
    const app = document.querySelector(".app-container");
    if (app) {
      app.setAttribute("aria-busy", "true");
      app.inert = true;
    }
  }

  function endServerRequest() {
    activeServerRequests = Math.max(0, activeServerRequests - 1);
    if (activeServerRequests || settingsCacheTimer) return;
    settingsCacheTimer = setTimeout(function () {
      settingsCacheTimer = null;
      if (activeServerRequests) return;
      const overlay = document.getElementById("app-loading-overlay");
      if (overlay) overlay.classList.remove("show");
      const app = document.querySelector(".app-container");
      if (app) {
        app.removeAttribute("aria-busy");
        app.inert = false;
      }
      disabledButtonsDuringRequest.forEach(function (entry) {
        if (entry.button.disabled) entry.button.disabled = entry.wasDisabled;
      });
      disabledButtonsDuringRequest = [];
    }, 120);
  }

  function trackedGoogleScriptRun(successHandler, failureHandler, userObject) {
    const runner = window.google.script.run;
    return new Proxy({}, {
      get: function (_, property) {
        if (property === "withSuccessHandler") {
          return function (handler) { return trackedGoogleScriptRun(handler, failureHandler, userObject); };
        }
        if (property === "withFailureHandler") {
          return function (handler) { return trackedGoogleScriptRun(successHandler, handler, userObject); };
        }
        if (property === "withUserObject") {
          return function (userObject) {
            return trackedGoogleScriptRun(successHandler, failureHandler, userObject);
          };
        }
        return function () {
          const args = Array.prototype.slice.call(arguments);
          beginServerRequest();
          let completed = false;
          function complete() {
            if (completed) return;
            completed = true;
            endServerRequest();
          }
          const ok = function () {
            try {
              if (successHandler) successHandler.apply(null, arguments);
            } finally {
              complete();
            }
          };
          const fail = function (error) {
            try {
              if (failureHandler) failureHandler.apply(null, arguments);
              else {
                console.error("Apps Script request failed:", error);
                showToast(error && error.message ? error.message : "Permintaan ke server gagal.", true);
              }
            } finally {
              complete();
            }
          };
          let configured = runner.withSuccessHandler(ok).withFailureHandler(fail);
          if (userObject !== undefined) configured = configured.withUserObject(userObject);
          try {
            configured[property].apply(configured, args);
          } catch (error) {
            complete();
            throw error;
          }
        };
      }
    });
  }

  const appScript = { get run() { return trackedGoogleScriptRun(); } };

  function readCachedAppSettings() {
    try {
      const cached = JSON.parse(localStorage.getItem(SETTINGS_CACHE_KEY) || "null");
      if (!cached || !cached.settings || !cached.expiresAt) return null;
      return { settings: cached.settings, fresh: Date.now() < cached.expiresAt };
    } catch (error) {
      return null;
    }
  }

  function cacheAppSettings(settings) {
    try {
      localStorage.setItem(SETTINGS_CACHE_KEY, JSON.stringify({
        settings: settings,
        expiresAt: Date.now() + SETTINGS_CACHE_TTL
      }));
    } catch (error) {
      console.warn("Pengaturan tidak dapat disimpan ke cache browser:", error);
    }
  }

  // Pengaturan Aplikasi dari Database (default sebelum dimuat)
  let appSettings = {
    HARGA_PER_TABUNG: "20000",
    KUOTA_PER_BATCH: "25",
    NAMA_KOPERASI: "Koperasi Desa Merah Putih (KDMP) Desa Gulun"
  };

  function getHargaFormatted() {
    const harga = parseInt(appSettings.HARGA_PER_TABUNG) || 20000;
    return "Rp " + harga.toLocaleString("id-ID");
  }

  // Inisialisasi saat halaman dimuat
  document.addEventListener("DOMContentLoaded", function () {
    initSalesImportControls();
    initCooperativeSettingsControls();
    initApp();
  });

  function initApp() {
    checkAuth();
    const cached = readCachedAppSettings();
    if (cached) {
      appSettings = cached.settings;
      applySettingsToUI();
      initializeDataViews();
      if (cached.fresh) return;
    }
    appScript.run
      .withSuccessHandler(function (settings) {
        if (settings) {
          appSettings = settings;
          cacheAppSettings(settings);
        }
        applySettingsToUI();
        appSettingsLoaded = true;
        if (!cached) initializeDataViews();
        else loadAdminDataOnce();
      })
      .withFailureHandler(function (error) {
        // Gunakan default jika gagal
        applySettingsToUI();
        appSettingsLoaded = true;
        if (!cached) initializeDataViews();
        else loadAdminDataOnce();
        console.error("Gagal memuat pengaturan:", error);
        showToast(error && error.message ? error.message : "Pengaturan belum dapat dimuat dari server.", true);
      })
      .getAppSettings();
  }

  function initializeDataViews() {
    appSettingsLoaded = true;
    loadPublicData();
    loadAdminDataOnce();
  }

  function loadAdminDataOnce() {
    if (!isAdmin || !appSettingsLoaded || adminDataLoaded) return;
    adminDataLoaded = true;
    loadBatches();
    loadDashboardData();
    loadMembersData();
  }

  function clearExpiredAdminSession(message) {
    if (isHandlingExpiredSession) return;
    isHandlingExpiredSession = true;
    sessionStorage.removeItem("KDMP_ADMIN_TOKEN");
    isAdmin = false;
    adminDataLoaded = false;
    updateAuthUI();
    showToast(message || "Sesi admin berakhir. Silakan login kembali.", true);
    setTimeout(function () {
      if (!isHandlingExpiredSession) return;
      switchTab("tab-public-home");
    }, 1200);
  }

  function applySettingsToUI() {
    // Update harga di semua elemen yang menampilkan harga
    const hargaFmt = getHargaFormatted();
    var priceEls = document.querySelectorAll(".dynamic-price");
    for (var i = 0; i < priceEls.length; i++) {
      priceEls[i].textContent = hargaFmt;
    }
    // Update harga default di input modal pickup
    var pickupPrice = document.getElementById("pickup-price");
    if (pickupPrice) pickupPrice.value = appSettings.HARGA_PER_TABUNG || "20000";

    const cooperativeName = appSettings.NAMA_KOPERASI || "Koperasi Desa Merah Putih (KDMP) Desa Gulun";
    const publicCumulativeVisibility = String(appSettings.TAMPILKAN_TOTAL_KUMULATIF).toLowerCase() === "true";
    const cumulativeVisibilityInput = document.getElementById("setting-cumulative-visibility");
    if (cumulativeVisibilityInput) cumulativeVisibilityInput.value = publicCumulativeVisibility ? "true" : "false";
    updateCumulativeReportColumnVisibility();
    if (typeof renderReportTable === "function" && Array.isArray(allMembersCache) && allMembersCache.length) {
      renderReportTable(allMembersCache);
    }
    const nameInput = document.getElementById("setting-org-name");
    if (nameInput) nameInput.value = cooperativeName;
    const brandSubtitle = document.getElementById("brand-subtitle");
    if (brandSubtitle) brandSubtitle.textContent = cooperativeName;
    const brandBadge = document.getElementById("brand-badge");
    const brandLogo = document.getElementById("brand-logo");
    const logoPreview = document.getElementById("setting-org-logo-preview");
    const emptyPreview = document.getElementById("setting-org-logo-empty");
    const logoUrl = appSettings.LOGO_DATA_URL || appSettings.LOGO_URL || "";
    if (brandLogo) {
      brandLogo.hidden = !logoUrl;
      if (logoUrl) brandLogo.src = logoUrl;
      else brandLogo.removeAttribute("src");
    }
    if (brandBadge) {
      brandBadge.textContent = cooperativeName;
      brandBadge.hidden = !!logoUrl;
    }
    if (logoPreview) {
      logoPreview.hidden = !logoUrl;
      if (logoUrl) logoPreview.src = logoUrl;
      else logoPreview.removeAttribute("src");
    }
    if (emptyPreview) emptyPreview.hidden = !!logoUrl;
    const orgName = document.getElementById("public-org-name");
    if (orgName) orgName.textContent = cooperativeName;
    const orgDescription = document.getElementById("public-org-description");
    if (orgDescription) orgDescription.textContent = cooperativeName;
    const orgLocation = document.getElementById("public-org-location");
    if (orgLocation) orgLocation.textContent = "Kantor " + cooperativeName;
    const loginOrg = document.getElementById("login-org-name");
    if (loginOrg) loginOrg.textContent = cooperativeName;
    const membersOrg = document.getElementById("members-org-name");
    if (membersOrg) membersOrg.textContent = cooperativeName;
    document.title = cooperativeName + " - Sistem Distribusi Gas LPG";
  }

  function initCooperativeSettingsControls() {
    const fileInput = document.getElementById("setting-org-logo");
    if (!fileInput) return;
    fileInput.addEventListener("change", function () {
      const file = fileInput.files && fileInput.files[0];
      const preview = document.getElementById("setting-org-logo-preview");
      const empty = document.getElementById("setting-org-logo-empty");
      if (!file) {
        applySettingsToUI();
        return;
      }
      if (["image/png", "image/jpeg", "image/webp"].indexOf(file.type) === -1 || file.size > 1024 * 1024) {
        fileInput.value = "";
        showToast("Logo harus PNG, JPEG, atau WebP dengan ukuran maksimal 1 MB.", true);
        return;
      }
      if (preview) {
        if (localLogoPreviewUrl) URL.revokeObjectURL(localLogoPreviewUrl);
        localLogoPreviewUrl = URL.createObjectURL(file);
        preview.src = localLogoPreviewUrl;
        preview.hidden = false;
      }
      if (empty) empty.hidden = true;
    });
  }

  function saveCooperativeSettings() {
    if (!isAdmin || !getAdminToken()) {
      showToast("Login admin diperlukan untuk mengubah identitas koperasi.", true);
      return;
    }
    const nameInput = document.getElementById("setting-org-name");
    const fileInput = document.getElementById("setting-org-logo");
    const button = document.getElementById("save-org-settings-button");
    const name = nameInput.value.trim();
    const file = fileInput.files && fileInput.files[0];
    if (name.length < 3 || name.length > 100) {
      showToast("Nama koperasi harus berisi 3 sampai 100 karakter.", true);
      return;
    }
    if (file && (["image/png", "image/jpeg", "image/webp"].indexOf(file.type) === -1 || file.size > 1024 * 1024)) {
      showToast("Logo harus PNG, JPEG, atau WebP dengan ukuran maksimal 1 MB.", true);
      return;
    }

    button.disabled = true;
    const sendSettings = function (logoDataUrl) {
      appScript.run
        .withSuccessHandler(function (result) {
          button.disabled = false;
          if (!result || !result.success) {
            if (result && result.code === 403) {
              clearExpiredAdminSession("Sesi admin berakhir. Silakan login kembali untuk menyimpan identitas.");
              return;
            }
            showToast(result && result.message ? result.message : "Pengaturan identitas gagal disimpan.", true);
            return;
          }
          appSettings = result.settings;
          cacheAppSettings(appSettings);
          if (localLogoPreviewUrl) {
            URL.revokeObjectURL(localLogoPreviewUrl);
            localLogoPreviewUrl = "";
          }
          applySettingsToUI();
          fileInput.value = "";
          showToast(result.message || "Identitas koperasi berhasil disimpan.");
        })
        .withFailureHandler(function (error) {
          button.disabled = false;
          showToast(error && error.message ? error.message : "Pengaturan identitas gagal disimpan.", true);
        })
        .saveCooperativeSettings(name, logoDataUrl, getAdminToken());
    };

    if (!file) {
      sendSettings("");
      return;
    }
    const reader = new FileReader();
    reader.onload = function () { sendSettings(String(reader.result || "")); };
    reader.onerror = function () {
      button.disabled = false;
      showToast("File logo tidak dapat dibaca oleh browser.", true);
    };
    reader.readAsDataURL(file);
  }

  function saveCumulativeVisibilitySetting() {
    if (!isAdmin || !getAdminToken()) {
      showToast("Login admin diperlukan untuk mengubah tampilan laporan.", true);
      return;
    }
    const button = document.getElementById("save-cumulative-visibility-button");
    const input = document.getElementById("setting-cumulative-visibility");
    button.disabled = true;
    appScript.run
      .withSuccessHandler(function (result) {
        button.disabled = false;
        if (!result || !result.success) {
          if (result && result.code === 403) {
            clearExpiredAdminSession("Sesi admin berakhir. Silakan login kembali untuk mengubah tampilan laporan.");
            return;
          }
          showToast(result && result.message ? result.message : "Pengaturan tampilan laporan gagal disimpan.", true);
          return;
        }
        appSettings = result.settings;
        cacheAppSettings(appSettings);
        applySettingsToUI();
        loadDashboardData();
        showToast(result.message || "Pengaturan tampilan laporan berhasil disimpan.");
      })
      .withFailureHandler(function (error) {
        button.disabled = false;
        showToast(error && error.message ? error.message : "Pengaturan tampilan laporan gagal disimpan.", true);
      })
      .saveCumulativeVisibilitySetting(input.value, getAdminToken());
  }

  function updateDatabaseRestoreButton() {
    const fileInput = document.getElementById("database-restore-file");
    const button = document.getElementById("database-restore-button");
    if (button) button.disabled = !isAdmin || !fileInput || !fileInput.files || !fileInput.files.length;
  }

  function setDatabaseBackupStatus(message, isError) {
    const status = document.getElementById("database-backup-status");
    if (!status) return;
    status.textContent = message;
    status.style.color = isError ? "var(--danger)" : "var(--text-muted)";
  }

  function downloadDatabaseBackup() {
    if (!isAdmin || !getAdminToken()) {
      showToast("Login admin diperlukan untuk membuat backup.", true);
      return;
    }
    const button = document.getElementById("database-backup-button");
    button.disabled = true;
    setDatabaseBackupStatus("Menyiapkan backup database...", false);
    appScript.run
      .withSuccessHandler(function (backup) {
        button.disabled = false;
        if (!backup || !backup.sheets || !backup.fileName) {
          setDatabaseBackupStatus("Server tidak mengembalikan data backup yang valid.", true);
          showToast("Backup gagal dibuat.", true);
          return;
        }
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = backup.fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        setDatabaseBackupStatus("Backup berhasil diunduh: " + backup.fileName, false);
        showToast("Backup JSON berhasil dibuat.");
      })
      .withFailureHandler(function (error) {
        button.disabled = false;
        if (handleAdminRequestError(error)) return;
        const message = error && error.message ? error.message : "Backup database gagal dibuat.";
        setDatabaseBackupStatus(message, true);
        showToast(message, true);
      })
      .createDatabaseBackup(getAdminToken());
  }

  function restoreDatabaseBackupFromFile() {
    if (!isAdmin || !getAdminToken()) {
      showToast("Login admin diperlukan untuk memulihkan backup.", true);
      return;
    }
    const fileInput = document.getElementById("database-restore-file");
    const button = document.getElementById("database-restore-button");
    const file = fileInput && fileInput.files && fileInput.files[0];
    if (!file) {
      showToast("Pilih file backup JSON terlebih dahulu.", true);
      return;
    }

    const reader = new FileReader();
    reader.onload = function () {
      const backupJson = String(reader.result || "");
      try {
        JSON.parse(backupJson);
      } catch (error) {
        setDatabaseBackupStatus("File bukan JSON yang valid.", true);
        showToast("File backup bukan JSON yang valid.", true);
        return;
      }
      if (!window.confirm(
        "Restore akan mengganti isi lima sheet aplikasi (ANGGOTA, BATCH_PENGIRIMAN, ANTRIAN_DISTRIBUSI, TRANSAKSI_PENJUALAN, PENGATURAN) dengan isi file " +
        file.name + ". Sheet lain tidak diubah. Pastikan file benar sebelum melanjutkan."
      )) return;

      button.disabled = true;
      setDatabaseBackupStatus("Memvalidasi dan memulihkan data...", false);
      appScript.run
        .withSuccessHandler(function (result) {
          button.disabled = false;
          if (!result || !result.success) {
            const message = result && result.message ? result.message : "Restore database gagal.";
            setDatabaseBackupStatus(message, true);
            showToast(message, true);
            updateDatabaseRestoreButton();
            return;
          }
          localStorage.removeItem(SETTINGS_CACHE_KEY);
          setDatabaseBackupStatus(result.message + " Memuat ulang aplikasi...", false);
          showToast(result.message || "Restore berhasil.");
          window.setTimeout(function () { window.location.reload(); }, 800);
        })
        .withFailureHandler(function (error) {
          button.disabled = false;
          if (handleAdminRequestError(error)) return;
          const message = error && error.message ? error.message : "Restore database gagal.";
          setDatabaseBackupStatus(message, true);
          showToast(message, true);
          updateDatabaseRestoreButton();
        })
        .restoreDatabaseBackup(backupJson, getAdminToken());
    };
    reader.onerror = function () {
      setDatabaseBackupStatus("File backup tidak dapat dibaca oleh browser.", true);
      showToast("File backup tidak dapat dibaca oleh browser.", true);
    };
    reader.readAsText(file);
  }

  // ==========================================
  // AUTENTIKASI ADMIN & SESSI PENGURUS
  // ==========================================

  function checkAuth() {
    const token = sessionStorage.getItem("KDMP_ADMIN_TOKEN");
    isAdmin = false;
    updateAuthUI();
    if (!token) return;

    appScript.run
      .withSuccessHandler(function (result) {
        if (!result || !result.success) {
          clearExpiredAdminSession("Sesi admin tidak valid atau sudah berakhir. Silakan login kembali.");
          return;
        }
        isAdmin = true;
        updateAuthUI();
        loadAdminDataOnce();
      })
      .withFailureHandler(function (error) {
        clearExpiredAdminSession(error && error.message ? error.message : "Sesi admin tidak dapat diverifikasi. Silakan login kembali.");
      })
      .validateAdminSession(token);
  }

  function updateAuthUI() {
    const adminTabs = document.querySelectorAll(".admin-tab");
    const btnLogin = document.getElementById("btn-login-modal");
    const adminBadge = document.getElementById("admin-badge-group");

    // Tab publik: tab-public-home dan tab-dashboard
    var adminOnlyTabs = ["tab-queue", "tab-members", "tab-sales-import", "tab-settings"];

    if (isAdmin) {
      adminTabs.forEach(function (t) { t.style.display = t.tagName === "TH" ? "table-cell" : "inline-block"; });
      if (btnLogin) btnLogin.style.display = "none";
      if (adminBadge) adminBadge.style.display = "flex";
      // Tampilkan kolom WA dan tombol CSV
      var waCol = document.getElementById("report-col-wa");
      if (waCol) waCol.style.display = "";
      var csvBtn = document.getElementById("btn-export-csv");
      if (csvBtn) csvBtn.style.display = "";
    } else {
      adminTabs.forEach(function (t) { t.style.display = "none"; });
      if (btnLogin) btnLogin.style.display = "inline-block";
      if (adminBadge) adminBadge.style.display = "none";
      // Sembunyikan kolom WA dan tombol CSV untuk publik
      var waCol = document.getElementById("report-col-wa");
      if (waCol) waCol.style.display = "none";
      var csvBtn = document.getElementById("btn-export-csv");
      if (csvBtn) csvBtn.style.display = "none";

      // Jika tab aktif saat ini adalah tab admin-only, kembalikan ke public home
      var currentActive = document.querySelector(".tab-pane.active");
      if (currentActive && adminOnlyTabs.indexOf(currentActive.id) !== -1 && !isHandlingExpiredSession) {
        switchTab("tab-public-home");
      }
    }
    updateCumulativeReportColumnVisibility();
    updateDatabaseRestoreButton();
    // Setelah update auth, render ulang tabel laporan jika ada cache
    if (allMembersCache.length > 0) renderReportTable(allMembersCache);
  }

  function openLoginModal() {
    document.getElementById("login-pin-input").value = "";
    openModal("modal-login");
    setTimeout(() => {
      document.getElementById("login-pin-input").focus();
    }, 200);
  }

  function submitLoginAdmin() {
    const pin = document.getElementById("login-pin-input").value;
    if (!pin) {
      showToast("Harap masukkan PIN Admin.", true);
      return;
    }

    showToast("Memverifikasi PIN Admin...");
    appScript.run
      .withSuccessHandler(function (res) {
        if (res.success) {
          sessionStorage.setItem("KDMP_ADMIN_TOKEN", res.token);
          isAdmin = true;
          isHandlingExpiredSession = false;
          adminDataLoaded = false;
          closeModal("modal-login");
          updateAuthUI();
          showToast(res.message);

          // Muat data admin dan pindah ke tab antrian
          loadAdminDataOnce();
          switchTab("tab-queue");
        } else {
          showToast(res.message, true);
        }
      })
      .withFailureHandler(function (err) {
        showToast(err.message, true);
      })
      .loginAdmin(pin);
  }

  function logoutAdmin() {
    const token = sessionStorage.getItem("KDMP_ADMIN_TOKEN");
    // Hapus session di server terlebih dahulu
    if (token) {
      appScript.run.logoutAdmin(token);
    }
    sessionStorage.removeItem("KDMP_ADMIN_TOKEN");
    isAdmin = false;
    updateAuthUI();
    switchTab("tab-public-home");
    showToast("Anda telah keluar dari mode admin.");
  }

  /**
   * Mendapatkan session token admin dari sessionStorage.
   * Token ini dikirim ke server untuk memvalidasi bahwa user sudah login.
   */
  function getAdminToken() {
    return sessionStorage.getItem("KDMP_ADMIN_TOKEN") || "";
  }

  function submitChangePin() {
    const oldPin = document.getElementById("input-old-pin").value;
    const newPin = document.getElementById("input-new-pin").value;

    if (!oldPin || !newPin) {
      alert("Harap isi PIN Lama dan PIN Baru.");
      return;
    }

    appScript.run
      .withSuccessHandler(function (res) {
        if (res.success) {
          showToast(res.message);
          document.getElementById("input-old-pin").value = "";
          document.getElementById("input-new-pin").value = "";
        } else {
          showToast(res.message, true);
        }
      })
      .withFailureHandler(function (err) {
        showToast(err.message, true);
      })
      .changeAdminPin(oldPin, newPin);
  }

  // ==========================================
  // NAVIGASI TAB & UI UTILS
  // ==========================================

  // Tab yang hanya boleh diakses admin
  var ADMIN_ONLY_TABS = ["tab-queue", "tab-members", "tab-sales-import", "tab-settings"];

  function switchTab(tabId) {
    // Validasi hak akses jika tab admin-only dibuka oleh tamu
    if (ADMIN_ONLY_TABS.indexOf(tabId) !== -1 && !isAdmin) {
      openLoginModal();
      return;
    }

    document.querySelectorAll(".tab-pane").forEach(function (el) { el.classList.remove("active"); });
    document.querySelectorAll(".tab-btn").forEach(function (el) { el.classList.remove("active"); });

    var targetTab = document.getElementById(tabId);
    if (targetTab) targetTab.classList.add("active");

    var activeBtn = Array.from(document.querySelectorAll(".tab-btn")).find(function (btn) {
      return btn.getAttribute("onclick") && btn.getAttribute("onclick").includes(tabId);
    });
    if (activeBtn) activeBtn.classList.add("active");

    var navMenu = document.querySelector(".nav-menu");
    if (navMenu && window.matchMedia("(max-width: 768px)").matches) navMenu.open = false;

    if (tabId === "tab-public-home") loadPublicData();
    if (tabId === "tab-dashboard") loadDashboardData();
    if (tabId === "tab-members" && isAdmin) loadMembersData();
    if (tabId === "tab-queue" && isAdmin && selectedBatchId) loadQueueData();
  }

  function showToast(message, isError = false) {
    const toast = document.getElementById("app-toast");
    toast.textContent = (isError ? "❌ " : "✅ ") + message;
    toast.style.background = isError ? "var(--danger)" : "var(--secondary)";
    toast.classList.add("show");
    setTimeout(() => {
      toast.classList.remove("show");
    }, 4000);
  }

  function openModal(modalId) {
    const m = document.getElementById(modalId);
    if (m) m.classList.add("show");
  }

  function closeModal(modalId) {
    const m = document.getElementById(modalId);
    if (m) m.classList.remove("show");
  }

  // ==========================================
  // BERANDA PUBLIK (UNTUK WARGA / UMUM)
  // ==========================================

  // Cache semua batch untuk dropdown filter publik
  var allBatchesCache = [];

  function getBatchScheduleLabel(batch) {
    if (!batch) return "-";
    const date = batch.tgl_jadwal || "-";
    return batch.hari && batch.hari !== "-" ? batch.hari + ", " + date : date;
  }

  function loadPublicData() {
    appScript.run
      .withSuccessHandler(function (summary) {
        document.getElementById("public-stat-month-quota").textContent =
          (summary.totalGasDistributedMonth || 0) + " / " + (summary.monthlyTargetQuota || 100) + " Tabung";
        document.getElementById("public-stat-served-count").textContent =
          (summary.servedCountMonth || 0) + " Warga";

        if (summary.recentBatches && summary.recentBatches.length > 0) {
          // Populate dropdown filter batch
          populateBatchFilter(summary.recentBatches);

          var latestBatch = summary.recentBatches[0];
          document.getElementById("public-stat-batch-date").textContent = latestBatch.tgl_jadwal;
          document.getElementById("public-stat-batch-day").textContent = latestBatch.hari;
          document.getElementById("public-stat-batch-stock").textContent = latestBatch.sisa_stok + " Tabung";
          document.getElementById("public-stat-batch-progress").textContent = "Terambil: " + latestBatch.jumlah_terambil + " / " + latestBatch.jumlah_stok;
          document.getElementById("public-batch-caption").textContent =
            "Batch: " + latestBatch.id_batch + " \u2022 Jadwal: " + getBatchScheduleLabel(latestBatch);

          // Jika dropdown sudah ada nilai terpilih, gunakan itu; jika tidak, gunakan batch terbaru
          var filterEl = document.getElementById("public-batch-filter");
          var batchToLoad = (filterEl && filterEl.value) ? filterEl.value : latestBatch.id_batch;
          loadPublicQueue(batchToLoad);
        } else {
          document.getElementById("public-stat-batch-date").textContent = "Belum Ada";
          document.getElementById("public-stat-batch-day").textContent = "Belum ada jadwal";
          document.getElementById("public-stat-batch-stock").textContent = "0 Tabung";
          document.getElementById("public-batch-caption").textContent = "Belum ada jadwal batch pengiriman aktif.";
          var filterEl = document.getElementById("public-batch-filter");
          if (filterEl) filterEl.innerHTML = "<option value=''>Belum ada batch</option>";
          renderPublicQueueTable([]);
        }
      })
      .withFailureHandler(function (err) {
        console.error("Gagal memuat ringkasan publik:", err);
        showToast(err && err.message ? err.message : "Ringkasan publik gagal dimuat.", true);
      })
      .getDashboardSummary();
  }

  function populateBatchFilter(batches) {
    allBatchesCache = batches;
    var filterEl = document.getElementById("public-batch-filter");
    if (!filterEl) return;
    var currentVal = filterEl.value;
    filterEl.innerHTML = "";
    batches.forEach(function (b, idx) {
      var opt = document.createElement("option");
      opt.value = b.id_batch;
      var label = "\uD83D\uDCC5 " + getBatchScheduleLabel(b);
      if (idx === 0) label += " — Terbaru";
      var done = parseInt(b.jumlah_terambil) || 0;
      var total = parseInt(b.jumlah_stok) || 25;
      label += " [" + done + "/" + total + " terambil]";
      opt.textContent = label;
      if (currentVal ? b.id_batch === currentVal : idx === 0) opt.selected = true;
      filterEl.appendChild(opt);
    });
  }

  function onPublicBatchFilterChange() {
    var filterEl = document.getElementById("public-batch-filter");
    var batchId = filterEl ? filterEl.value : "";
    if (!batchId) return;

    // Update info batch card sesuai pilihan
    var selected = allBatchesCache.find(function (b) { return b.id_batch === batchId; });
    if (selected) {
      document.getElementById("public-stat-batch-date").textContent = selected.tgl_jadwal;
      document.getElementById("public-stat-batch-day").textContent = selected.hari;
      document.getElementById("public-stat-batch-stock").textContent = selected.sisa_stok + " Tabung";
      document.getElementById("public-stat-batch-progress").textContent = "Terambil: " + selected.jumlah_terambil + " / " + selected.jumlah_stok;
      document.getElementById("public-batch-caption").textContent =
        "Batch: " + selected.id_batch + " \u2022 Jadwal: " + getBatchScheduleLabel(selected);
    }

    // Reset search lalu muat antrian batch yang dipilih
    var searchEl = document.getElementById("public-search-input");
    if (searchEl) searchEl.value = "";
    loadPublicQueue(batchId);
  }

  function loadPublicQueue(batchId) {
    var requestBatchId = String(batchId || "").trim();
    var requestId = ++publicQueueRequestId;
    var tbody = document.getElementById("public-queue-table-body");
    publicQueueCache = [];
    publicQueueCacheBatchId = requestBatchId;
    if (tbody) tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;padding:20px;color:var(--text-muted);'>Memuat antrian...</td></tr>";
    appScript.run
      .withSuccessHandler(function (queueList) {
        var filterEl = document.getElementById("public-batch-filter");
        if (requestId !== publicQueueRequestId || !filterEl || String(filterEl.value || "").trim() !== requestBatchId) return;
        publicQueueCache = (queueList || []).filter(function (item) {
          return String(item.id_batch || "").trim() === requestBatchId;
        });
        renderPublicQueueTable(publicQueueCache);
      })
      .withFailureHandler(function (err) {
        var filterEl = document.getElementById("public-batch-filter");
        if (requestId !== publicQueueRequestId || !filterEl || String(filterEl.value || "").trim() !== requestBatchId) return;
        console.error("Gagal memuat antrian publik:", err);
        if (tbody) tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;padding:20px;color:var(--danger);'>Antrian batch ini gagal dimuat. Silakan segarkan halaman.</td></tr>";
        showToast(err && err.message ? err.message : "Antrian publik gagal dimuat.", true);
      })
      .getQueueByBatch(requestBatchId);
  }

  function renderPublicQueueTable(items) {
    var tbody = document.getElementById("public-queue-table-body");
    tbody.innerHTML = "";

    if (!items || items.length === 0) {
      tbody.innerHTML = "<tr><td colspan='6' style='text-align: center; padding: 25px; color: var(--text-muted);'>Belum ada data pengambilan untuk batch ini.</td></tr>";
      return;
    }

    items.forEach(function (item) {
      var tr = document.createElement("tr");
      var isDone = item.status_antrian === "SUDAH_DIAMBIL";
      var cells = [
        { value: item.no_urut ? "#" + item.no_urut : "-", style: "text-align:center;font-weight:800;color:var(--secondary);" },
        { value: item.nama_anggota_penerima || "-", style: "font-weight:700;" },
        { value: item.rt_rw_penerima || "-", style: "" },
        { value: String(item.jumlah_tabung || 1) + " tabung", style: "text-align:center;" }
      ];
      var badge = document.createElement("span");
      badge.className = isDone ? "kpi-badge badge-success" : "kpi-badge badge-accent";
      badge.textContent = isDone ? "✓ Sudah Diambil" : "Menunggu Ambil";
      var statusCell = document.createElement("td");
      statusCell.style.cssText = "text-align:center;";
      statusCell.appendChild(badge);

      var note = item.is_historical_import ? "Transaksi impor" : "-";
      if (isDone && item.waktu_ambil && item.waktu_ambil !== "-") note += (note === "-" ? "" : " · ") + "Diambil: " + item.waktu_ambil;
      else if (item.is_replaced) note = "Pengganti tercatat";

      cells.forEach(function (data) {
        var cell = document.createElement("td");
        cell.style.cssText = data.style;
        cell.textContent = data.value;
        tr.appendChild(cell);
      });
      tr.appendChild(statusCell);
      var noteCell = document.createElement("td");
      noteCell.style.cssText = "font-size:12px;color:var(--text-muted);";
      noteCell.textContent = note;
      tr.appendChild(noteCell);
      tbody.appendChild(tr);
    });
  }

  function filterPublicQueue() {
    var query = document.getElementById("public-search-input").value.toLowerCase().trim();
    var filterEl = document.getElementById("public-batch-filter");
    if (!filterEl || String(filterEl.value || "").trim() !== publicQueueCacheBatchId) return;
    if (!query) {
      renderPublicQueueTable(publicQueueCache);
      return;
    }
    var filtered = publicQueueCache.filter(function (item) {
      return String(item.nama_anggota_penerima || "").toLowerCase().includes(query) ||
        String(item.rt_rw_penerima || "").toLowerCase().includes(query);
    });
    renderPublicQueueTable(filtered);
  }

  // ==========================================
  // MANAJEMEN BATCH & ANTRIAN (ADMIN ONLY)
  // ==========================================

  function loadBatches(preserveSelection) {
    if (!isAdmin) return;
    const previousBatchId = preserveSelection ? selectedBatchId : "";
    appScript.run
      .withSuccessHandler(function (batches) {
        currentBatches = batches || [];
        const select = document.getElementById("select-batch");
        select.innerHTML = "";

        if (currentBatches.length === 0) {
          select.innerHTML = "<option value=''>Belum ada batch. Buat batch baru!</option>";
          document.getElementById("queue-empty").style.display = "block";
          document.getElementById("queue-loading").style.display = "none";
          setQueueRefreshLoading(false);
          return;
        }

        currentBatches.forEach((b, index) => {
          const opt = document.createElement("option");
          opt.value = b.id_batch;
          opt.textContent = `${b.id_batch} - ${getBatchScheduleLabel(b)} [Stok: ${b.sisa_stok}/${b.jumlah_stok}]`;
          if (b.id_batch === previousBatchId || (!previousBatchId && index === 0)) opt.selected = true;
          select.appendChild(opt);
        });

        selectedBatchId = select.value;
        updateBatchInfoCard();
        loadQueueData();
      })
      .withFailureHandler(function (err) {
        setQueueRefreshLoading(false);
        showToast(err.message, true);
      })
      .getAllBatches();
  }

  function refreshQueuePage() {
    setQueueRefreshLoading(true);
    loadBatches(true);
  }

  function setQueueRefreshLoading(loading) {
    const button = document.getElementById("refresh-queue-button");
    if (!button) return;
    button.disabled = loading;
    button.textContent = loading ? "⏳ Memuat..." : "🔄 Segarkan";
  }

  function updateBatchInfoCard() {
    const batch = currentBatches.find(b => b.id_batch === selectedBatchId);
    const card = document.getElementById("batch-info-card");
    if (!batch) {
      card.style.display = "none";
      return;
    }

    card.style.display = "block";
    document.getElementById("batch-title").textContent = `Batch Gas LPG: ${getBatchScheduleLabel(batch)}`;
    document.getElementById("batch-details").textContent = `ID: ${batch.id_batch} • Status: ${batch.status_batch}`;
    document.getElementById("batch-total-stok").textContent = batch.jumlah_stok + " Tabung";
    document.getElementById("batch-terambil").textContent = batch.jumlah_terambil + " Terambil";
    document.getElementById("batch-sisa").textContent = batch.sisa_stok + " Sisa";
  }

  function loadQueueData() {
    if (!isAdmin) return;
    const select = document.getElementById("select-batch");
    selectedBatchId = select.value;
    if (!selectedBatchId) {
      updateGenerateQueueButtons(0, true);
      return;
    }

    updateBatchInfoCard();
    updateGenerateQueueButtons(0, true);

    document.getElementById("queue-loading").style.display = "block";
    document.getElementById("queue-cards-grid").style.display = "none";
    document.getElementById("queue-empty").style.display = "none";

    appScript.run
      .withSuccessHandler(function (queueList) {
        document.getElementById("queue-loading").style.display = "none";
        currentQueue = queueList || [];
        updateGenerateQueueButtons(currentQueue.length);
        setQueueRefreshLoading(false);

        if (currentQueue.length === 0) {
          document.getElementById("queue-empty").style.display = "block";
          return;
        }

        renderQueueCards(currentQueue);
      })
      .withFailureHandler(function (err) {
        document.getElementById("queue-loading").style.display = "none";
        updateGenerateQueueButtons(0);
        setQueueRefreshLoading(false);
        showToast(err.message, true);
      })
      .getQueueByBatch(selectedBatchId, getAdminToken());
  }

  function updateGenerateQueueButtons(queueCount, loading) {
    const batch = currentBatches.find(b => b.id_batch === selectedBatchId);
    const quantity = batch ? Number(batch.jumlah_stok) || 25 : 25;
    const buttons = [
      document.getElementById("generate-queue-button"),
      document.getElementById("generate-queue-empty-button")
    ];

    buttons.forEach(function (button) {
      if (!button) return;
      button.style.display = loading || queueCount > 0 || !batch || batch.status_batch !== "DRAFT" ? "none" : "";
    });

    const toolbarButton = buttons[0];
    const emptyButton = buttons[1];
    if (toolbarButton) toolbarButton.textContent = `⚡ Generate Antrian (${quantity} Tabung)`;
    if (emptyButton) emptyButton.textContent = `⚡ Generate ${quantity} Antrian Sekarang`;
  }

  function renderQueueCards(items) {
    const grid = document.getElementById("queue-cards-grid");
    grid.innerHTML = "";
    grid.style.display = "grid";

    const batch = currentBatches.find(b => b.id_batch === selectedBatchId);
    const batchDateStr = batch ? getBatchScheduleLabel(batch) : "tanggal batch yang tertera";

    items.forEach(item => {
      const card = document.createElement("div");
      let statusClass = "status-menunggu";
      let statusBadge = "<span class='kpi-badge badge-accent'>Menunggu</span>";

      if (item.status_antrian === "SUDAH_DIAMBIL") {
        statusClass = "status-sudah";
        statusBadge = "<span class='kpi-badge badge-success'>✓ Sudah Diambil</span>";
      } else if (item.status_antrian === "DIGANTIKAN") {
        statusClass = "status-digantikan";
        statusBadge = "<span class='kpi-badge badge-warning'>Ditukar Penerima</span>";
      } else if (item.status_antrian === "BATAL_LEWAT") {
        statusClass = "status-batal";
        statusBadge = "<span class='kpi-badge' style='background:#FEE2E2; color:#DC2626;'>Dibatalkan</span>";
      }

      card.className = `queue-card ${statusClass}`;
      card.id = `card-queue-${item.id_antrian}`;

      let replacedHtml = "";
      if (item.is_replaced) {
        replacedHtml = `
          <div class="queue-replaced-info">
            ⚠️ <em>Jatah Asli:</em> <strong>${item.nama_anggota_asli}</strong><br>
            <span style="font-size: 10px;">${item.keterangan_penyesuaian}</span>
          </div>
        `;
      }

      // Keterangan status WA terakhir
      const hasWa = item.waktu_terakhir_wa && item.waktu_terakhir_wa !== "-";
      const waBadge = hasWa
        ? `<span id="wa-badge-${item.id_antrian}" class="kpi-badge badge-success" style="font-size: 11px;">📱 WA: ${item.waktu_terakhir_wa}</span>`
        : `<span id="wa-badge-${item.id_antrian}" class="kpi-badge" style="font-size: 11px; background:#F1F5F9; color:#64748B;">📱 Belum di-WA</span>`;

      let actionsHtml = "";
      if (item.status_antrian !== "SUDAH_DIAMBIL") {
        actionsHtml = `
          <div class="queue-actions" style="flex-wrap: wrap;">
            <button class="btn btn-outline btn-sm" style="color:#0284C7;" onclick="sendPersonalWaReminder('${item.id_antrian}', '${item.no_whatsapp}', '${escapeQuotes(item.nama_anggota_penerima)}', ${item.no_urut}, '${escapeQuotes(batchDateStr)}')">
              💬 Kirim WA
            </button>
            <button class="btn btn-outline btn-sm" onclick="openSwapModal('${item.id_antrian}', ${item.no_urut}, '${escapeQuotes(item.nama_anggota_penerima)}')">⇄ Tukar</button>
            <button class="btn btn-outline btn-sm" onclick="openReplaceModal('${item.id_antrian}', '${item.id_anggota_penerima}')">✎ Ganti Orang</button>
            <button class="btn btn-success btn-sm" onclick="openPickupModal('${item.id_antrian}', ${item.no_urut}, '${escapeQuotes(item.nama_anggota_penerima)}', '${escapeQuotes(item.rt_rw_penerima)}')">✓ Ambil & Bayar</button>
          </div>
        `;
      } else {
        actionsHtml = `
          <div class="queue-actions">
            <span style="font-size: 11px; color: var(--success); font-weight: 600;">Diambil: ${item.waktu_ambil}</span>
          </div>
        `;
      }

      card.innerHTML = `
        <div>
          <div class="queue-header">
            <div class="queue-number">#${item.no_urut}</div>
            <div style="display: flex; gap: 6px; align-items: center;">
              ${waBadge}
              ${statusBadge}
            </div>
          </div>
          <div class="queue-member-name">${item.nama_anggota_penerima}</div>
          <div class="queue-member-sub" data-queue-member-nik style="font-weight: 700;"></div>
          <div class="queue-member-sub">${item.id_anggota_penerima} • ${item.rt_rw_penerima}</div>
          <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">WA: ${item.no_whatsapp || "-"}</div>
          ${replacedHtml}
        </div>
        ${actionsHtml}
      `;

      const nikLine = card.querySelector("[data-queue-member-nik]");
      if (nikLine) nikLine.textContent = "NIK: " + (item.no_ktp_penerima || "Belum tersedia");

      const actions = card.querySelector(".queue-actions");
      if (actions) {
        const mapButton = document.createElement("button");
        mapButton.type = "button";
        const hasMapRecord = !!(item.map_anggota_id || item.map_atas_nama);
        mapButton.className = hasMapRecord
          ? "btn btn-sm map-record-saved"
          : "btn btn-outline btn-sm";
        mapButton.textContent = hasMapRecord ? "Edit Data MAP" : "Kirim ke MAP";
        mapButton.addEventListener("click", function () {
          openQueueMapModal(item.id_antrian);
        });
        actions.appendChild(mapButton);
      }

      grid.appendChild(card);
    });
  }

  function openQueueMapModal(queueId) {
    if (!isAdmin) {
      showToast("Login admin diperlukan untuk mencatat data MAP.", true);
      return;
    }
    const item = currentQueue.find(function (queueItem) { return queueItem.id_antrian === queueId; });
    if (!item) {
      showToast("Data antrian tidak ditemukan. Segarkan daftar antrian lalu coba lagi.", true);
      return;
    }

    document.getElementById("map-queue-id").value = item.id_antrian;
    document.getElementById("map-queue-number").textContent = "#" + item.no_urut;
    document.getElementById("map-member-name").textContent = item.nama_anggota_penerima || "-";
    document.getElementById("map-member-nik").textContent = item.no_ktp_penerima || "Belum tersedia";
    const exactNameMatches = function (name) {
      const normalizedName = String(name || "").trim().toLocaleLowerCase("id");
      return allMembersCache.filter(function (member) {
        return String(member.nama_lengkap || "").trim().toLocaleLowerCase("id") === normalizedName;
      });
    };
    let selectedMember = item.map_anggota_id
      ? allMembersCache.find(function (member) { return member.id_anggota === item.map_anggota_id; })
      : null;
    const legacyName = item.map_nama_snapshot || item.map_atas_nama || "";
    if (!selectedMember && legacyName) {
      const legacyMatches = exactNameMatches(legacyName);
      if (legacyMatches.length === 1) selectedMember = legacyMatches[0];
    }
    if (!selectedMember && !legacyName) {
      selectedMember = allMembersCache.find(function (member) { return member.id_anggota === item.id_anggota_penerima; }) || null;
      if (!selectedMember) {
        const receiverMatches = exactNameMatches(item.nama_anggota_penerima);
        if (receiverMatches.length === 1) selectedMember = receiverMatches[0];
      }
    }

    selectedMapMemberId = selectedMember ? selectedMember.id_anggota : "";
    const memberSearch = document.getElementById("map-member-search");
    memberSearch.value = selectedMember
      ? formatMapMemberLabel(selectedMember)
      : legacyName || "";
    closeMapMemberOptions();
    if (selectedMember) {
      document.getElementById("map-member-selection-status").textContent = "Dipilih: " + formatMapMemberLabel(selectedMember);
    } else if (legacyName) {
      document.getElementById("map-member-selection-status").textContent = "Data lama: '" + legacyName + "'. Pilih anggota koperasi dari daftar untuk memperbarui catatan.";
    } else {
      document.getElementById("map-member-selection-status").textContent = "Pilih anggota koperasi dari daftar.";
    }
    document.getElementById("map-record-status").textContent = item.map_atas_nama
      ? "Catatan tersimpan" + (item.map_diperbarui_pada ? " • Diperbarui " + item.map_diperbarui_pada : "")
      : "Belum ada catatan MAP untuk antrian ini.";
    document.getElementById("save-map-record-button").disabled = false;
    document.getElementById("save-map-record-button").textContent = "Simpan Catatan MAP";
    openModal("modal-queue-map");
  }

  function formatMapMemberLabel(member) {
    return String(member.nama_lengkap || "") + " — NIK: " + (String(member.no_ktp || "").trim() || "Belum tersedia");
  }

  function closeMapMemberOptions() {
    const list = document.getElementById("map-member-options");
    const input = document.getElementById("map-member-search");
    if (list) {
      list.replaceChildren();
      list.hidden = true;
    }
    if (input) {
      input.setAttribute("aria-expanded", "false");
      input.setAttribute("aria-activedescendant", "");
    }
    mapMemberOptions = [];
    mapMemberActiveIndex = -1;
  }

  function searchMapMembers() {
    const input = document.getElementById("map-member-search");
    const list = document.getElementById("map-member-options");
    if (!input || !list) return;
    const query = input.value.trim().toLocaleLowerCase("id");
    const selectedMember = allMembersCache.find(function (member) { return member.id_anggota === selectedMapMemberId; });
    if (!selectedMember || input.value !== formatMapMemberLabel(selectedMember)) {
      selectedMapMemberId = "";
      document.getElementById("map-member-selection-status").textContent = "Pilih salah satu anggota dari saran; teks bebas tidak dapat disimpan.";
    }

    mapMemberOptions = allMembersCache.filter(function (member) {
      const name = String(member.nama_lengkap || "").toLocaleLowerCase("id");
      const nik = String(member.no_ktp || "").toLocaleLowerCase("id");
      return !query || name.includes(query) || nik.includes(query);
    }).slice().sort(function (a, b) {
      return String(a.nama_lengkap || "").localeCompare(String(b.nama_lengkap || ""), "id");
    }).slice(0, 10);

    list.replaceChildren();
    mapMemberActiveIndex = -1;
    if (!mapMemberOptions.length) {
      const empty = document.createElement("div");
      empty.className = "map-member-empty";
      empty.textContent = allMembersCache.length ? "Tidak ada anggota yang cocok." : "Data anggota belum dimuat. Tutup lalu buka kembali modal setelah data termuat.";
      list.appendChild(empty);
    } else {
      mapMemberOptions.forEach(function (member, index) {
        const option = document.createElement("button");
        option.type = "button";
        option.id = "map-member-option-" + index;
        option.className = "map-member-option";
        option.setAttribute("role", "option");
        option.setAttribute("aria-selected", "false");
        const name = document.createElement("span");
        name.className = "map-member-option-name";
        name.textContent = member.nama_lengkap || "-";
        const nik = document.createElement("span");
        nik.className = "map-member-option-nik";
        nik.textContent = "NIK: " + (String(member.no_ktp || "").trim() || "Belum tersedia");
        option.append(name, nik);
        option.addEventListener("click", function () { selectMapMember(index); });
        list.appendChild(option);
      });

  function selectMapMember(index) {

  function handleMapMemberKeydown(event) {
    if (event.key === "Escape") {
      closeMapMemberOptions();
      return;
    }
    if (event.key !== "ArrowDown" && event.key !== "ArrowUp" && event.key !== "Enter") return;
    const list = document.getElementById("map-member-options");
    if (event.key === "Enter" && (!list || list.hidden)) return;
    event.preventDefault();
    if (event.key === "Enter") {
      if (mapMemberActiveIndex >= 0) selectMapMember(mapMemberActiveIndex);
      return;
    }
    if (!list || list.hidden) searchMapMembers();
    if (!mapMemberOptions.length) return;
    const step = event.key === "ArrowDown" ? 1 : -1;
    mapMemberActiveIndex = mapMemberActiveIndex < 0
      ? (event.key === "ArrowDown" ? 0 : mapMemberOptions.length - 1)
      : (mapMemberActiveIndex + step + mapMemberOptions.length) % mapMemberOptions.length;
    document.querySelectorAll("#map-member-options [role='option']").forEach(function (option, index) {
      const active = index === mapMemberActiveIndex;
      option.setAttribute("aria-selected", active ? "true" : "false");
      if (active) {
        document.getElementById("map-member-search").setAttribute("aria-activedescendant", option.id);
        option.scrollIntoView({ block: "nearest" });
      }
    });
  }

  function formatReplacementMember(member) {
    return String(member.nama_lengkap || "") + " — NIK: " + (String(member.no_ktp || "").trim() || "Belum tersedia");
  }

  function initializeMemberCombobox(input, list, status, settings) {
    settings = settings || {};
    const initialMemberId = String(settings.initialMemberId || "");
    const initialMember = allMembersCache.find(function (member) {
      return String(member.id_anggota) === initialMemberId;
    });
    const state = { options: [], activeIndex: -1, selectedId: initialMember ? initialMember.id_anggota : "", settings: settings };
    input._memberComboState = state;
    if (initialMember) {
      input.value = formatReplacementMember(initialMember);
      status.textContent = (settings.subject || "Penerima") + " saat ini: " + formatReplacementMember(initialMember) + (initialMember.rt_rw ? " • " + initialMember.rt_rw : "");
    }

    function closeList() {
      list.replaceChildren();
      list.hidden = true;
      input.setAttribute("aria-expanded", "false");
      input.setAttribute("aria-activedescendant", "");
      state.options = [];
      state.activeIndex = -1;
    }

    function selectMember(member) {
      state.selectedId = member.id_anggota;
      input.value = formatReplacementMember(member);
      status.textContent = "Dipilih: " + formatReplacementMember(member) + (member.rt_rw ? " • " + member.rt_rw : "");
      closeList();
      if (typeof settings.onSelect === "function") settings.onSelect(member);
    }

    function renderOptions() {
      const query = input.value.trim().toLocaleLowerCase("id");
      const selected = allMembersCache.find(function (member) { return member.id_anggota === state.selectedId; });
      if (!selected || input.value !== formatReplacementMember(selected)) {
        state.selectedId = "";
        if (typeof settings.onSelect === "function") settings.onSelect(null);
        status.textContent = "Pilih salah satu anggota dari saran; teks bebas tidak dapat disimpan.";
      }

      state.options = allMembersCache.filter(function (member) {
        if ((!settings.includeInactive && member.status_aktif !== "AKTIF") || member.id_anggota === settings.excludeId) return false;
        const name = String(member.nama_lengkap || "").toLocaleLowerCase("id");
        const nik = String(member.no_ktp || "").toLocaleLowerCase("id");
        return !query || name.includes(query) || nik.includes(query);
      }).slice().sort(function (a, b) {
        return String(a.nama_lengkap || "").localeCompare(String(b.nama_lengkap || ""), "id");
      }).slice(0, 10);
      state.activeIndex = -1;
      list.replaceChildren();

      if (!state.options.length) {
        const empty = document.createElement("div");
        empty.className = "member-combobox-empty";
        empty.textContent = allMembersCache.length
          ? (settings.includeInactive ? "Tidak ada anggota yang cocok." : "Tidak ada anggota aktif yang cocok.")
          : "Data anggota belum dimuat.";
        list.appendChild(empty);
      } else {
        state.options.forEach(function (member, index) {
          const option = document.createElement("button");
          option.type = "button";
          option.id = input.id + "-option-" + index;
          option.className = "member-combobox-option";
          option.setAttribute("role", "option");
          option.setAttribute("aria-selected", "false");
          const name = document.createElement("span");
          name.className = "member-combobox-option-name";
          name.textContent = member.nama_lengkap || "-";
          const details = document.createElement("span");
          details.className = "member-combobox-option-details";
          details.textContent = "NIK: " + (String(member.no_ktp || "").trim() || "Belum tersedia") + (member.rt_rw ? " • " + member.rt_rw : "");
          option.append(name, details);
          option.addEventListener("pointerdown", function (event) { event.preventDefault(); });
          option.addEventListener("click", function () { selectMember(member); });
          list.appendChild(option);
        });
      }
      list.hidden = false;
      input.setAttribute("aria-expanded", "true");
    }

    input.oninput = renderOptions;
    input.onfocus = renderOptions;
    input.onkeydown = function (event) {
      if (event.key === "Escape") {
        closeList();
        return;
      }
      if (["ArrowDown", "ArrowUp", "Enter"].indexOf(event.key) === -1) return;
      if (event.key === "Enter" && list.hidden) return;
      event.preventDefault();
      if (event.key === "Enter") {
        if (state.activeIndex >= 0) selectMember(state.options[state.activeIndex]);
        return;
      }
      if (list.hidden) renderOptions();
      if (!state.options.length) return;
      state.activeIndex = state.activeIndex < 0
        ? (event.key === "ArrowDown" ? 0 : state.options.length - 1)
        : (state.activeIndex + (event.key === "ArrowDown" ? 1 : -1) + state.options.length) % state.options.length;
      list.querySelectorAll("[role='option']").forEach(function (option, index) {
        const active = index === state.activeIndex;
        option.setAttribute("aria-selected", active ? "true" : "false");
        if (active) {
          input.setAttribute("aria-activedescendant", option.id);
          option.scrollIntoView({ block: "nearest" });
        }
      });
    };
    state.close = closeList;
    state.getSelectedId = function () { return state.selectedId; };
    state.selectMember = selectMember;
    return state;
  }

  function handleAdminRequestError(error) {
    const message = error && error.message ? error.message : "";

      return true;
    }
    return false;
  }

  function renderBulkReplaceRows() {
    const list = document.getElementById("bulk-replace-list");

        entry = {
          queueId: item.id_antrian,
          currentMemberId: item.id_anggota_penerima,
          currentMapMemberId: item.map_anggota_id || "",
          currentStatus: item.status_antrian || "MENUNGGU",
          pending: false,
          changed: false,
          message: "Belum diubah."
        };
        state.entries.set(item.id_antrian, entry);
      }
      const row = document.createElement("div");
      row.className = "bulk-replace-row";
      const slot = document.createElement("div");
      const slotTitle = document.createElement("div");
      slotTitle.className = "bulk-replace-slot";
      slotTitle.textContent = "Antrian #" + item.no_urut;
      const current = document.createElement("div");
      current.className = "bulk-replace-current";
      current.textContent = item.nama_anggota_penerima + " • NIK: " + (item.no_ktp_penerima || "-");
      entry.currentDisplay = current;
      slot.append(slotTitle, current);

      function createMemberControl(labelText, suffix, initialMemberId, fieldName, includeInactive) {
        const control = document.createElement("div");
        control.className = "bulk-replace-control";
        const label = document.createElement("label");
        label.className = "form-label";
        label.textContent = labelText;
        const combo = document.createElement("div");
        combo.className = "member-combobox";
        const input = document.createElement("input");
        input.type = "text";
        input.id = "bulk-" + suffix + "-search-" + item.id_antrian;
        label.htmlFor = input.id;
        input.className = "input-text";
        input.style.width = "100%";
        input.style.boxSizing = "border-box";
        input.style.minWidth = "0";
        input.setAttribute("role", "combobox");
        input.setAttribute("aria-autocomplete", "list");
        input.setAttribute("aria-expanded", "false");
        input.setAttribute("aria-controls", input.id + "-options");
        input.setAttribute("aria-activedescendant", "");
        input.autocomplete = "off";
        input.placeholder = "Cari nama atau NIK anggota";
        const options = document.createElement("div");
        options.id = input.id + "-options";
        options.className = "member-combobox-options";
        options.style.width = "100%";
        options.setAttribute("role", "listbox");
        options.hidden = true;
        const comboStatus = document.createElement("div");
        comboStatus.className = "member-combobox-status";
        comboStatus.setAttribute("aria-live", "polite");
        comboStatus.textContent = "Pilih anggota dari saran.";
        combo.append(input, options);
        control.append(label, combo, comboStatus);
        const memberCombo = initializeMemberCombobox(input, options, comboStatus, {
          initialMemberId: initialMemberId,
          includeInactive: includeInactive,
          subject: fieldName === "newMapMemberId" ? "MAP" : "Penerima",
          excludeId: fieldName === "newMemberId" ? initialMemberId : "",
          onSelect: function (member) {
            const currentId = fieldName === "newMemberId" ? entry.currentMemberId : entry.currentMapMemberId;
            if (member && String(member.id_anggota) !== String(currentId || "")) {
              saveBulkQueueChange(entry, fieldName, member.id_anggota, member, input);
            }
          }
        });
        return { control: control, input: input, combo: memberCombo };
      }

      const recipientField = createMemberControl(
        "Ganti Penerima",
        "replace",
        entry.currentMemberId,
        "newMemberId",
        false
      );
      const mapField = createMemberControl(
        "Orang MAP",
        "map",
        entry.currentMapMemberId || item.id_anggota_penerima,
        "newMapMemberId",
        true
      );
      if (!entry.currentMapMemberId) {
        const mapStatus = mapField.control.querySelector(".member-combobox-status");
        if (mapStatus) mapStatus.textContent = "Pilihan awal mengikuti penerima antrian; pilih anggota untuk menyimpan data MAP.";
      }
      const statusControl = document.createElement("div");
      statusControl.className = "bulk-replace-control";
      const statusLabel = document.createElement("label");
      statusLabel.className = "form-label";
      statusLabel.htmlFor = "bulk-status-" + item.id_antrian;
      statusLabel.textContent = "Status Pengambilan";
      const statusSelect = document.createElement("select");
      statusSelect.id = statusLabel.htmlFor;
      statusSelect.className = "select-control";
      statusSelect.style.width = "100%";
      const statuses = ["MENUNGGU", "BATAL_LEWAT", "SUDAH_DIAMBIL", "DIGANTIKAN"];
      if (entry.currentStatus && statuses.indexOf(entry.currentStatus) === -1) statuses.push(entry.currentStatus);
      statuses.forEach(function (value) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value.replace(/_/g, " ");
        option.disabled = value === "DIGANTIKAN" && entry.currentStatus !== "DIGANTIKAN";
        statusSelect.appendChild(option);
      });
      statusSelect.value = entry.currentStatus;
      statusControl.append(statusLabel, statusSelect);
      const rowStatus = document.createElement("div");
      rowStatus.className = "bulk-replace-row-status" + (entry.isError ? " is-error" : "");
      rowStatus.setAttribute("aria-live", "polite");
      rowStatus.textContent = entry.message;
      row.append(slot, recipientField.control, mapField.control, statusControl, rowStatus);
      list.appendChild(row);

      entry.controls = [recipientField.input, mapField.input, statusSelect];
      entry.nonMapControls = [recipientField.input, statusSelect];
      entry.recipientInput = recipientField.input;
      entry.mapInput = mapField.input;
      entry.statusSelect = statusSelect;
      entry.rowStatus = rowStatus;
      entry.recipientCombo = recipientField.combo;
      entry.mapCombo = mapField.combo;
      statusSelect.addEventListener("change", function () {
        const nextStatus = statusSelect.value;
        if (nextStatus === entry.currentStatus) return;
        if (nextStatus === "SUDAH_DIAMBIL") {
          statusSelect.value = entry.currentStatus;
          openBulkPickupModal(entry);
          return;
        }
        saveBulkQueueChange(entry, "newStatus", nextStatus, null, statusSelect);
      });
      updateBulkQueueEntryControls(entry);
    });
    updateBulkReplaceSummary();
  }

  function openBulkPickupModal(entry) {
    const item = currentQueue.find(function (queueItem) { return queueItem.id_antrian === entry.queueId; });
    if (!item || !bulkReplaceState) {
      showToast("Data antrian tidak ditemukan. Segarkan daftar antrian lalu coba lagi.", true);
      return;
    }
    bulkPickupContext = {
      entry: entry,
      requestState: bulkReplaceState
    };
    openPickupModal(item.id_antrian, item.no_urut, item.nama_anggota_penerima, item.rt_rw_penerima, true);
  }

  function updateBulkQueueEntryControls(entry) {
    const taken = entry.currentStatus === "SUDAH_DIAMBIL";
    (entry.controls || []).forEach(function (control) {
      control.disabled = entry.pending || (taken && control !== entry.mapInput);
    });
  }

  function saveBulkQueueChange(entry, fieldName, value, member, input) {
    if (!bulkReplaceState || entry.pending) return;
    const unchanged = fieldName === "newMemberId"
      ? String(value) === String(entry.currentMemberId)
      : fieldName === "newMapMemberId"
        ? String(value) === String(entry.currentMapMemberId)
        : String(value) === String(entry.currentStatus);
    if (unchanged) return;

    entry.pending = true;
    entry.isError = false;
    entry.message = "Menyimpan perubahan...";
    bulkReplaceState.pending++;
    updateBulkQueueEntryControls(entry);
    if (entry.rowStatus) entry.rowStatus.textContent = entry.message;
    updateBulkReplaceSummary();
    const requestState = bulkReplaceState;
    const mapping = { queueId: entry.queueId };
    mapping[fieldName] = value;
    appScript.run
      .withSuccessHandler(function (response) {
        const result = response && response.results && response.results[0];
        completeBulkQueueChange(requestState, entry, fieldName, value, member, input, result || { success: false, message: "Server tidak mengembalikan hasil perubahan." });
      })
      .withFailureHandler(function (error) {
        if (handleAdminRequestError(error)) {
          completeBulkQueueChange(requestState, entry, fieldName, value, member, input, { success: false, message: "Sesi admin berakhir." });
          return;
        }
        completeBulkQueueChange(requestState, entry, fieldName, value, member, input, { success: false, message: error && error.message ? error.message : "Penyimpanan gagal." });
      })
      .updateQueueItemsBulk(requestState.batchId, [mapping], getAdminToken());
  }

  function completeBulkQueueChange(requestState, entry, fieldName, value, member, input, result) {
    entry.pending = false;
    requestState.pending = Math.max(0, requestState.pending - 1);
    if (result.success) {
      if (fieldName === "newMemberId") {
        entry.currentMemberId = member.id_anggota;
        entry.currentStatus = "DIGANTIKAN";
        entry.recipientCombo.settings.excludeId = member.id_anggota;
        const queueItem = currentQueue.find(function (item) { return item.id_antrian === entry.queueId; });
        if (queueItem) {
          queueItem.id_anggota_penerima = member.id_anggota;
          queueItem.nama_anggota_penerima = member.nama_lengkap;
          queueItem.no_ktp_penerima = member.no_ktp || "";
          queueItem.rt_rw_penerima = member.rt_rw || "-";
          queueItem.is_replaced = queueItem.id_anggota_asli !== member.id_anggota;
          queueItem.status_antrian = "DIGANTIKAN";
        }
        if (entry.currentDisplay) {
          entry.currentDisplay.textContent = member.nama_lengkap + " • NIK: " + (member.no_ktp || "-");
        }
        if (entry.statusSelect) {
          const replacedOption = entry.statusSelect.querySelector('option[value="DIGANTIKAN"]');
          if (replacedOption) replacedOption.disabled = false;
          entry.statusSelect.value = "DIGANTIKAN";
        }
      } else if (fieldName === "newMapMemberId") {
        entry.currentMapMemberId = member.id_anggota;
        const queueItem = currentQueue.find(function (item) { return item.id_antrian === entry.queueId; });
        if (queueItem) {
          queueItem.map_anggota_id = member.id_anggota;
          queueItem.map_atas_nama = member.nama_lengkap;
          queueItem.map_nama_snapshot = member.nama_lengkap;
        }
      } else {
        entry.currentStatus = value;
        const queueItem = currentQueue.find(function (item) { return item.id_antrian === entry.queueId; });
        if (queueItem) queueItem.status_antrian = value;
      }
      entry.changed = true;
      entry.isError = false;
      entry.message = result.message || "Perubahan berhasil disimpan.";
      requestState.changed = true;
    } else {
      entry.isError = true;
      entry.message = result.message || "Penyimpanan gagal.";
      if (fieldName === "newMemberId" && input._memberComboState) {
        input._memberComboState.selectedId = entry.currentMemberId;
        const currentMember = allMembersCache.find(function (item) { return String(item.id_anggota) === String(entry.currentMemberId); });
        input.value = currentMember ? formatReplacementMember(currentMember) : "";
      } else if (fieldName === "newMapMemberId" && input._memberComboState) {
        input._memberComboState.selectedId = entry.currentMapMemberId;
        const currentMapMember = allMembersCache.find(function (item) { return String(item.id_anggota) === String(entry.currentMapMemberId); });
        input.value = currentMapMember ? formatReplacementMember(currentMapMember) : "";
      } else if (fieldName === "newStatus") {
        input.value = entry.currentStatus;
      }
    }
    updateBulkQueueEntryControls(entry);
    if (entry.rowStatus) {
      entry.rowStatus.textContent = entry.message;
      entry.rowStatus.classList.toggle("is-error", entry.isError);
    }
    updateBulkReplaceSummary();
    if (requestState.closeRequested && requestState.pending === 0) finishBulkReplaceModal(requestState);
  }

  function updateBulkReplaceSummary() {
    const summary = document.getElementById("bulk-replace-summary");
    if (!summary || !bulkReplaceState) return;
    const savedCount = Array.from(bulkReplaceState.entries.values()).filter(function (entry) { return entry.changed; }).length;
    summary.textContent = bulkReplaceState.pending
      ? "Menyimpan " + bulkReplaceState.pending + " perubahan..."
      : savedCount + " perubahan tersimpan";
  }

  function requestCloseBulkReplaceModal() {
    const state = bulkReplaceState;
    if (!state) {
      closeModal("modal-bulk-replace");
      return;
    }
    if (state.pending > 0) {
      state.closeRequested = true;
      closeModal("modal-bulk-replace");
      showToast("Perubahan masih disimpan; antrian akan diperbarui setelah selesai.");
      return;
    }
    finishBulkReplaceModal(state);
  }

  function finishBulkReplaceModal(state) {
    if (!state || state.finalRefreshDone) return;
    state.finalRefreshDone = true;
    closeModal("modal-bulk-replace");
    if (state.changed && selectedBatchId === state.batchId) {
      loadQueueData();
    }
    bulkReplaceState = null;
  }

  document.getElementById("queue-wa-text").addEventListener("input", updateQueueAnnouncementPreview);

  function buildQueueAnnouncementText() {
    var batch = currentBatches.find(function (b) { return b.id_batch === selectedBatchId; });
    var hargaFmt = getHargaFormatted();
    var kuota = appSettings.KUOTA_PER_BATCH || "25";
    var text = "*DAFTAR ANTRIAN GAS LPG 3KG " + appSettings.NAMA_KOPERASI.toUpperCase() + "*\n";
    text += "\u{1F4C5} Jadwal: " + getBatchScheduleLabel(batch) + "\n";
    text += "\u{1F4E6} Kuota: " + kuota + " Tabung\n";
    text += "--------------------------------------\n";

    currentQueue.forEach(function (item) {
      var statusIcon = item.status_antrian === "SUDAH_DIAMBIL" ? "\u2705" : "\u23F3";
      text += item.no_urut + ". " + item.nama_anggota_penerima + " (" + item.rt_rw_penerima + ") " + statusIcon + "\n";
    });

    text += "--------------------------------------\n";
    text += "_Harap membawa tabung kosong dan uang pas " + hargaFmt + "._\n";
    text += "_" + appSettings.NAMA_KOPERASI + "_";

    return text;
  }

  function updateQueueAnnouncementPreview() {
    const textarea = document.getElementById("queue-wa-text");
    const preview = document.getElementById("queue-wa-preview");
    if (!textarea || !preview) return;

    const formattingPattern = /```([^`]+)```|\*([^*\n]+)\*|_([^_\n]+)_|~([^~\n]+)~/g;
    const fragment = document.createDocumentFragment();
    let lastIndex = 0;
    let match;

    while ((match = formattingPattern.exec(textarea.value)) !== null) {
      if (match.index > lastIndex) {
        fragment.appendChild(document.createTextNode(textarea.value.slice(lastIndex, match.index)));
      }

      const elementName = match[1] !== undefined
        ? "code"
        : match[2] !== undefined
          ? "strong"
          : match[3] !== undefined
            ? "em"
            : "del";
      const formatted = document.createElement(elementName);
      formatted.textContent = match[1] !== undefined ? match[1] : match[2] || match[3] || match[4];
      fragment.appendChild(formatted);
      lastIndex = formattingPattern.lastIndex;
    }

    if (lastIndex < textarea.value.length) {
      fragment.appendChild(document.createTextNode(textarea.value.slice(lastIndex)));
    }
    preview.replaceChildren(fragment);
  }

  function copyEditedQueueAnnouncement() {
    const textarea = document.getElementById("queue-wa-text");
    if (!textarea || !navigator.clipboard || !navigator.clipboard.writeText) {
      showToast("Fitur salin tidak tersedia di browser ini.", true);
      return;
    }

    navigator.clipboard.writeText(textarea.value).then(function () {
      closeModal("modal-copy-queue-wa");
      showToast("Teks pengumuman berhasil disalin. Silakan tempel di WhatsApp.");
    }).catch(function (error) {
      console.error("Gagal menyalin teks pengumuman:", error);
      showToast("Teks tidak dapat disalin. Periksa izin clipboard browser lalu coba lagi.", true);
    });
  }
