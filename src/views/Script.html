  function reportColumnCount() {
    return (isAdmin ? 7 : 6) + (isCumulativeReportVisible() ? 1 : 0);
  }

  function updateCumulativeReportColumnVisibility() {
    const cumulativeColumn = document.getElementById("report-col-cumulative");
    if (cumulativeColumn) {
      cumulativeColumn.style.display = isCumulativeReportVisible() ? "table-cell" : "none";
    }
    const placeholder = document.querySelector("#report-table-body td[colspan]");
    if (placeholder) placeholder.colSpan = reportColumnCount();
  }

  function isCumulativeReportVisible() {
    return isAdmin || String(appSettings.TAMPILKAN_TOTAL_KUMULATIF).toLowerCase() === "true";
  }

  function compareReportMembers(a, b) {
    var key = reportSort.key;
    if (key === "priority") {
      var priorityOrder = Number(a.total_beli_bulan_ini > 0) - Number(b.total_beli_bulan_ini > 0);
      if (priorityOrder) return priorityOrder;
      return String(a.nama_lengkap || "").localeCompare(String(b.nama_lengkap || ""), "id") ||
        String(a.id_anggota || "").localeCompare(String(b.id_anggota || ""), "id", { numeric: true });
    }

    var left = key === "status_kuota" ? Number(a.total_beli_bulan_ini || 0) : a[key];
    var right = key === "status_kuota" ? Number(b.total_beli_bulan_ini || 0) : b[key];
    var leftBlank = left === null || left === undefined || left === "" || left === "-";
    var rightBlank = right === null || right === undefined || right === "" || right === "-";
    if (leftBlank || rightBlank) return leftBlank === rightBlank ? 0 : (leftBlank ? 1 : -1);

    var comparison;
    if (key === "total_beli_bulan_ini" || key === "total_beli_kumulatif" || key === "status_kuota") {
      comparison = Number(left) - Number(right);
    } else if (key === "tgl_terakhir_beli") {
      comparison = Date.parse(String(left).replace(" ", "T")) - Date.parse(String(right).replace(" ", "T"));
    } else {
      comparison = String(left).localeCompare(String(right), "id", { numeric: true, sensitivity: "base" });
    }

    if (comparison === 0) {
      comparison = String(a.id_anggota || "").localeCompare(String(b.id_anggota || ""), "id", { numeric: true });
    }
    return comparison * reportSort.direction;
  }

  function sortReportTable(key) {
    if (reportSort.key === key) reportSort.direction *= -1;
    else reportSort = { key: key, direction: 1 };
    filterReportTable();
  }

  function renderReportTable(members) {
    var tbody = document.getElementById("report-table-body");
    if (!tbody) return;
    tbody.innerHTML = "";

    var countBadge = document.getElementById("report-count-badge");
    if (countBadge) countBadge.textContent = (members ? members.length : 0) + " anggota";

    document.querySelectorAll("#report-table thead th[data-sort-key]").forEach(function (th) {
      var active = th.dataset.sortKey === reportSort.key;
      th.setAttribute("aria-sort", active ? (reportSort.direction === 1 ? "ascending" : "descending") : "none");
      var indicator = th.querySelector(".report-sort-indicator");
      if (indicator) indicator.textContent = active ? (reportSort.direction === 1 ? "▲" : "▼") : "↕";
    });

    if (!members || members.length === 0) {
      var emptyRow = document.createElement("tr");
      var emptyCell = document.createElement("td");
      emptyCell.colSpan = reportColumnCount();
      emptyCell.style.textAlign = "center";
      emptyCell.style.padding = "20px";
      emptyCell.textContent = "Tidak ada data anggota.";
      emptyRow.appendChild(emptyCell);
      tbody.appendChild(emptyRow);
      return;
    }

    members.slice().sort(compareReportMembers).forEach(function (m) {
      var tr = document.createElement("tr");
      var isServed = m.total_beli_bulan_ini > 0;
      var cells = [
        { value: m.id_anggota || "-", strong: true },
        { value: m.nama_lengkap || "-" },
        { value: m.rt_rw || "-" }
      ];
      if (isAdmin) cells.push({ value: m.no_whatsapp || "-" });
      cells.push(
        { value: m.total_beli_bulan_ini || 0 },
        ...(isCumulativeReportVisible() ? [{ value: m.total_beli_kumulatif || 0 }] : []),
        { value: m.tgl_terakhir_beli || "-" },
        { badge: true, value: isServed ? "Sudah Ambil (" + m.total_beli_bulan_ini + ")" : "Belum Dapat (Prioritas)", className: isServed ? "kpi-badge badge-success" : "kpi-badge badge-primary" }
      );
      cells.forEach(function (cellData) {
        var cell = document.createElement("td");
        if (cellData.badge) {
          var badge = document.createElement("span");
          badge.className = cellData.className;
          badge.textContent = cellData.value;
          cell.appendChild(badge);
        } else {
          cell.textContent = String(cellData.value);
          if (cellData.strong) {
            var strong = document.createElement("strong");
            strong.textContent = cell.textContent;
            cell.textContent = "";
            cell.appendChild(strong);
          }
        }
        tr.appendChild(cell);
      });
      tbody.appendChild(tr);
    });
  }

  function filterReportTable() {
    var query = String(document.getElementById("report-search").value || "").toLowerCase().trim();
    var filterStatus = document.getElementById("report-filter-status").value;

    var filtered = allMembersCache.filter(function (m) {
      var matchSearch = String(m.nama_lengkap || "").toLowerCase().includes(query) ||
        String(m.id_anggota || "").toLowerCase().includes(query) ||
        String(m.rt_rw || "").toLowerCase().includes(query);
      var matchStatus = true;
      if (filterStatus === "UNSERVED") matchStatus = (m.total_beli_bulan_ini === 0);
      if (filterStatus === "SERVED") matchStatus = (m.total_beli_bulan_ini > 0);
      return matchSearch && matchStatus;
    });

    renderReportTable(filtered);
  }

  function exportReportToCSV() {
    if (!isAdmin) return;
    var csvColumns = [
      ["ID Anggota", function (m) { return m.id_anggota; }],
      ["Nama Lengkap", function (m) { return m.nama_lengkap; }],
      ["RT/RW", function (m) { return m.rt_rw; }],
      ["No HP/WA", function (m) { return m.no_whatsapp; }],
      ["Beli Bulan Ini", function (m) { return m.total_beli_bulan_ini; }],
      ["Terakhir Ambil Gas", function (m) { return m.tgl_terakhir_beli; }],
      ["Status Kuota", function (m) { return m.total_beli_bulan_ini > 0 ? "Sudah Ambil" : "Belum Dapat"; }]
    ];
    if (isCumulativeReportVisible()) {
      csvColumns.splice(5, 0, ["Total Kumulatif", function (m) { return m.total_beli_kumulatif; }]);
    }
    var csv = csvColumns.map(function (column) { return column[0]; }).join(",") + "\n";
    allMembersCache.forEach(function (member) {
      csv += csvColumns.map(function (column) {
        var value = column[1](member);
        return '"' + String(value == null ? "" : value).replace(/"/g, '""') + '"';
      }).join(",") + "\n";
    });

    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Rekap_Gas_${(appSettings.NAMA_KOPERASI || "Koperasi").replace(/[^a-z0-9]+/gi, "_")}_${new Date().toISOString().split("T")[0]}.csv`;
    link.click();
  }

  function renderPendingSalesImports(pending) {
    const host = document.getElementById("sales-pending-list");

    if (!pending || !pending.length) {
      host.textContent = "Tidak ada penjualan yang menunggu mapping.";

    fillMemberAutocompleteDatalist(allMembersCache);
    const table = document.createElement("table");

    const head = document.createElement("thead");
    const headerRow = document.createElement("tr");
    ["Tanggal", "Pelanggan sumber", "Tabung", "Batch", "Pilih anggota", "Aksi"].forEach(function (label) {
      const th = document.createElement("th");
      th.textContent = label;
      headerRow.appendChild(th);
    });
    head.appendChild(headerRow);
    table.appendChild(head);
    const body = document.createElement("tbody");
    pending.forEach(function (item) {
      const row = document.createElement("tr");
      [item.tgl_waktu_transaksi, item.nama_sumber, String(item.jumlah_tabung), item.id_batch].forEach(function (value) {
        const td = document.createElement("td");
        td.textContent = value || "-";
        row.appendChild(td);
      });
      const choiceCell = document.createElement("td");
      const input = document.createElement("input");
      input.className = "input-text pending-member-choice";
      input.type = "text";
      input.setAttribute("list", "member-autocomplete-options");
      input.dataset.transactionId = item.id_transaksi;
      input.placeholder = "Ketik nama anggota...";
      input.setAttribute("aria-label", "Pilih anggota untuk " + item.nama_sumber);
      choiceCell.appendChild(input);
      row.appendChild(choiceCell);

      const actionCell = document.createElement("td");
      const mapButton = document.createElement("button");
      mapButton.className = "btn btn-primary btn-sm";
      mapButton.type = "button";
      mapButton.textContent = "Petakan";
      mapButton.addEventListener("click", function () { mapPendingSalesImport(item.id_transaksi, input.value); });
      const deleteButton = document.createElement("button");
      deleteButton.className = "btn btn-outline btn-sm";
      deleteButton.type = "button";
      deleteButton.textContent = "Hapus";
      deleteButton.style.marginLeft = "6px";
      deleteButton.addEventListener("click", function () { removePendingSalesImport(item.id_transaksi, item.nama_sumber); });
      actionCell.appendChild(mapButton);
      actionCell.appendChild(deleteButton);
      row.appendChild(actionCell);
      body.appendChild(row);
    });
    table.appendChild(body);
    host.appendChild(table);
  }

  function findMemberByAutocompleteLabel(label) {
    const normalized = String(label || "").trim();
    return allMembersCache.find(function (member) { return memberAutocompleteLabel(member) === normalized; }) || null;
  }

  function mapPendingSalesImport(transactionId, selectedLabel) {
    const member = findMemberByAutocompleteLabel(selectedLabel);
    if (!member) {
      showToast("Pilih nama dari saran autocomplete agar anggota teridentifikasi dengan benar.", true);
      return;
    }
    appScript.run
      .withSuccessHandler(function (res) {
        showToast(res.message || "Transaksi berhasil dipetakan.");
        loadPendingSalesImports();
        loadMembersData();
        loadDashboardData();
        loadPublicData();
      })
      .withFailureHandler(function (err) { showToast(err.message || "Mapping transaksi gagal.", true); })
      .resolvePendingSalesImport(transactionId, member.id_anggota, getAdminToken());
  }

  function removePendingSalesImport(transactionId, customerName) {
    if (!confirm("Hapus transaksi pending milik " + customerName + "? Stok batch terkait juga akan dikoreksi.")) return;
    appScript.run
      .withSuccessHandler(function (res) {
        showToast(res.message || "Transaksi pending dihapus.");
        loadPendingSalesImports();
        loadBatches();
        loadDashboardData();
        loadPublicData();
      })
      .withFailureHandler(function (err) { showToast(err.message || "Penghapusan transaksi gagal.", true); })
      .deletePendingSalesImport(transactionId, getAdminToken());
  }

  function renderMemberTable(members) {
    const tbody = document.getElementById("member-table-body");
    tbody.innerHTML = "";

    document.querySelectorAll("[data-member-sort-indicator]").forEach(function (indicator) {
      const active = indicator.dataset.memberSortIndicator === memberSort.key;
      indicator.textContent = active ? (memberSort.direction === 1 ? "▲" : "▼") : "↕";
      const header = indicator.closest("th");
      if (header) header.setAttribute("aria-sort", active ? (memberSort.direction === 1 ? "ascending" : "descending") : "none");
    });

    if (!members || members.length === 0) {
      tbody.innerHTML = "<tr><td colspan='8' style='text-align:center; padding:20px;'>Belum ada data anggota.</td></tr>";
      return;
    }

    members.slice().sort(compareMembersForTable).forEach(m => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>${m.id_anggota}</strong></td>
        <td style="font-weight: 600;">${m.nama_lengkap}</td>
        <td>${m.no_ktp || "-"}</td>
        <td>${m.rt_rw}</td>
        <td>${m.no_whatsapp || "-"}</td>
        <td><span class="kpi-badge ${m.status_aktif === 'AKTIF' ? 'badge-success' : 'badge-primary'}">${m.status_aktif}</span></td>
        <td style="text-align: center; font-weight: 700;">${m.total_beli_kumulatif}</td>
        <td>
          <button class="btn btn-outline btn-sm" onclick="openEditMemberModal('${m.id_anggota}')">Edit</button>
        </td>
      `;
      const statusBadge = tr.querySelector("td:nth-child(6) span");
      const exitReason = String(m.alasan_keluar || "").trim();
      if (statusBadge && m.status_aktif !== "AKTIF" && exitReason) {
        statusBadge.title = exitReason;
      }
      tbody.appendChild(tr);
    });
  }

  function compareMembersForTable(a, b) {
    const key = memberSort.key;
    const left = a[key];
    const right = b[key];
    let comparison;
    if (key === "total_beli_kumulatif") {
      comparison = Number(left || 0) - Number(right || 0);
    } else {
      comparison = String(left || "").localeCompare(String(right || ""), "id", {
        numeric: true,
        sensitivity: "base"
      });
    }
    if (comparison === 0 && key !== "id_anggota") {
      comparison = String(a.id_anggota || "").localeCompare(String(b.id_anggota || ""), "id", { numeric: true });
    }
    return comparison * memberSort.direction;
  }

  function sortMemberTable(key) {
    if (memberSort.key === key) memberSort.direction *= -1;
    else memberSort = { key: key, direction: 1 };
    filterMemberTable();
  }

  function filterMemberTable() {
    const query = document.getElementById("member-search").value.toLowerCase().trim();
    const filterStatus = document.getElementById("member-filter-status").value;

    const filtered = allMembersCache.filter(m => {
      const matchSearch = m.nama_lengkap.toLowerCase().includes(query) ||
        m.no_ktp.toLowerCase().includes(query) ||
        m.id_anggota.toLowerCase().includes(query) ||
        m.rt_rw.toLowerCase().includes(query);

      let matchStatus = true;
      if (filterStatus !== "ALL") matchStatus = (m.status_aktif === filterStatus);

      return matchSearch && matchStatus;
    });

    renderMemberTable(filtered);
  }

  function openAddMemberModal() {
    document.getElementById("modal-member-title").textContent = "Tambah Anggota Baru";
    document.getElementById("form-member-id").value = "";
    document.getElementById("form-member-name").value = "";
    document.getElementById("form-member-nik").value = "";
    document.getElementById("form-member-rt").value = "";
    document.getElementById("form-member-wa").value = "";
    document.getElementById("form-member-status").value = "AKTIF";
    document.getElementById("form-member-exit-reason").value = "";
    openModal("modal-member");
  }

  function openEditMemberModal(memberId) {
    const m = allMembersCache.find(x => x.id_anggota === memberId);
    if (!m) return;

    document.getElementById("modal-member-title").textContent = `Edit Anggota (${memberId})`;
    document.getElementById("form-member-id").value = m.id_anggota;
    document.getElementById("form-member-name").value = m.nama_lengkap;
    document.getElementById("form-member-nik").value = m.no_ktp;
    document.getElementById("form-member-rt").value = m.rt_rw;
    document.getElementById("form-member-wa").value = m.no_whatsapp;
    document.getElementById("form-member-status").value = m.status_aktif;
    document.getElementById("form-member-exit-reason").value = m.alasan_keluar || "";
    openModal("modal-member");
  }

  function saveMemberForm() {
    const memberId = document.getElementById("form-member-id").value;
    const data = {
      nama_lengkap: document.getElementById("form-member-name").value,
      no_ktp: document.getElementById("form-member-nik").value,
      rt_rw: document.getElementById("form-member-rt").value,
      no_whatsapp: document.getElementById("form-member-wa").value,
      status_aktif: document.getElementById("form-member-status").value,
      alasan_keluar: document.getElementById("form-member-exit-reason").value.trim()
    };

    if (!data.nama_lengkap) {
      alert("Nama lengkap wajib diisi.");
      return;
    }

    if (memberId) {
      // Update — sertakan token untuk validasi server
      data.sessionToken = getAdminToken();
      appScript.run
        .withSuccessHandler(function (res) {
          closeModal("modal-member");
          showToast(res.message);
          loadMembersData();
        })
        .withFailureHandler(function (err) {
          showToast(err.message, true);
        })
        .updateMember(memberId, data);
    } else {
      // Add — sertakan token untuk validasi server
      data.sessionToken = getAdminToken();
      appScript.run
        .withSuccessHandler(function (res) {
          closeModal("modal-member");
          showToast(res.message);
          loadMembersData();
        })
        .withFailureHandler(function (err) {
          showToast(err.message, true);
        })
        .addMember(data);
    }
  }

  function confirmResetMonth() {
    if (confirm("Apakah Anda yakin ingin mereset kuota bulanan? Kolom 'total_beli_bulan_ini' akan di-set menjadi 0 untuk semua anggota agar giliran bulan baru dimulai.")) {
      showToast("Sedang mereset kuota bulanan...");
      appScript.run
        .withSuccessHandler(function (res) {
          showToast(res.message);
          loadMembersData();
          loadDashboardData();
          loadPublicData();
        })
        .withFailureHandler(function (err) {
          showToast(err.message, true);
        })
        .resetMonthlyQuota(getAdminToken());
    }
  }

  function importFromReference() {
    if (confirm("Salin data anggota warga Desa Gulun dari sheet 'template_simkopdes' ke dalam database? Data referensi asli tidak akan diubah.")) {
      const importButton = document.querySelector("#tab-settings button[onclick='importFromReference()']");
      if (importButton) importButton.disabled = true;
      showToast("Sedang membaca dan menyinkronkan data anggota...");
      appScript.run
        .withSuccessHandler(function (res) {
          if (importButton) importButton.disabled = false;
          if (!res || !res.success) {
            showToast(res && res.message ? res.message : "Sinkronisasi anggota gagal.", true);
            return;
          }
          const importedCount = Number(res.totalImported || 0);
          const updatedCount = Number(res.totalUpdated || 0);
          const totalCount = Number(res.totalMembersNow || 0);
          document.getElementById("member-import-result-message").textContent = importedCount + updatedCount === 0
            ? "Data sudah sinkron. Tidak ada anggota baru atau perubahan status yang perlu diterapkan."
            : `Sinkronisasi selesai dari sheet ${res.sheetSource || "referensi"}.`;
          document.getElementById("member-imported-count").textContent = importedCount.toLocaleString("id-ID");
          document.getElementById("member-updated-count").textContent = updatedCount.toLocaleString("id-ID");
          document.getElementById("member-total-count").textContent = totalCount.toLocaleString("id-ID");
          document.getElementById("member-import-source").textContent = res.message || "";
          openModal("modal-member-import-result");
          loadMembersData();
          loadDashboardData();
          loadPublicData();
        })
        .withFailureHandler(function (err) {
          if (importButton) importButton.disabled = false;
          showToast(err.message, true);
        })
        .importMembersFromReference("template_simkopdes", getAdminToken());
    }
  }

  function initSalesImportControls() {
    const fileInput = document.getElementById("sales-import-file");
    const priceInput = document.getElementById("sales-import-price");
    if (fileInput) fileInput.addEventListener("change", resetSalesImportPreview);
    if (priceInput) priceInput.addEventListener("input", function () {
      document.getElementById("sales-import-price-confirm").checked = false;
      updateSalesImportButton();
    });
  }

  function resetSalesImportPreview() {
    salesImportState = null;
    document.getElementById("sales-import-preview").style.display = "none";
    document.getElementById("sales-import-result").textContent = "";
    document.getElementById("sales-import-summary").textContent = "";
    document.getElementById("sales-import-mapping").textContent = "";
    document.getElementById("sales-import-price").value = "";
    document.getElementById("sales-import-price-confirm").checked = false;
    document.getElementById("sales-import-commit-button").disabled = true;
  }

  function resetSalesImportForm() {
    document.getElementById("sales-import-file").value = "";
    resetSalesImportPreview();
  }

  function closeSalesImportPriceWarning() {
    closeModal("modal-sales-import-price-warning");
    document.getElementById("sales-import-price-confirm").focus();
  }

  function previewSalesImport() {
    if (!isAdmin || !getAdminToken()) {
      showToast("Login admin diperlukan untuk mengimpor transaksi.", true);
      return;
    }
    const fileInput = document.getElementById("sales-import-file");
    const file = fileInput.files && fileInput.files[0];
    if (!file) {
      showToast("Pilih file JSON penjualan terlebih dahulu.", true);
      return;
    }
    if (!file.name.toLowerCase().endsWith(".json")) {
      showToast("File harus berekstensi .json.", true);
      return;
    }

    const button = document.getElementById("sales-import-preview-button");
    button.disabled = true;
    showToast("Memvalidasi file dan mencocokkan data anggota...");
    const reader = new FileReader();
    reader.onload = function () {
      const jsonText = String(reader.result || "");
      appScript.run
        .withSuccessHandler(function (res) {
          button.disabled = false;
          if (!res || !res.success) {
            showToast(res && res.message ? res.message : "Pratinjau impor gagal.", true);
            return;
          }
          salesImportState = { jsonText: jsonText, fileName: file.name, preview: res };
          renderSalesImportPreview(res);
          showToast("Pratinjau siap. Periksa harga dan pemetaan sebelum impor.");
        })
        .withFailureHandler(function (err) {
          button.disabled = false;
          showToast(err.message || "Gagal membaca pratinjau impor.", true);
        })
        .getSalesImportPreview(jsonText, file.name, getAdminToken());
    };
    reader.onerror = function () {
      button.disabled = false;
      showToast("File tidak dapat dibaca oleh browser.", true);
    };
    reader.readAsText(file, "UTF-8");
  }

  function renderSalesImportPreview(preview) {
    const summaryHost = document.getElementById("sales-import-summary");
    summaryHost.textContent = "";
    const summaryTable = document.createElement("table");
    summaryTable.className = "data-table";
    const rows = [
      ["Periode", preview.period],
      ["Pelanggan", preview.customers.length],
      ["Tabung (ringkasan / hasil jumlah baris)", preview.summary.sold + " / " + preview.summary.sold],
      ["Gross", formatSalesImportCurrency(preview.summary.gross)],
      ["Modal (informasi sumber)", formatSalesImportCurrency(preview.summary.modal)],
      ["Profit (informasi sumber)", formatSalesImportCurrency(preview.summary.profit)],
      ["Cocok otomatis", preview.counts.matched],
      ["Nama ambigu", preview.counts.ambiguous],
      ["Tidak cocok", preview.counts.unmatched],
      ["Duplikat yang akan dilewati", preview.counts.duplicates],
      ["Usulan harga per tabung", preview.suggestedPrice === null ? "Wajib diisi manual" : formatSalesImportCurrency(preview.suggestedPrice)]
    ];
    (preview.batchPlan || []).forEach(function (batch) {
      rows.push([
        "Periode " + batch.date + " s.d. " + batch.periodEnd + " · " + batch.customers + " pelanggan",
        batch.batchId + " · " + batch.units + " tabung · " + batch.volumeStatus.label
      ]);
    });
    const body = document.createElement("tbody");
    rows.forEach(function (row) {
      const tr = document.createElement("tr");
      const label = document.createElement("th");
      const value = document.createElement("td");
      label.textContent = row[0];
      value.textContent = String(row[1]);
      tr.appendChild(label);
      tr.appendChild(value);
      body.appendChild(tr);
    });
    summaryTable.appendChild(body);
    summaryHost.appendChild(summaryTable);

    const priceInput = document.getElementById("sales-import-price");
    priceInput.value = preview.suggestedPrice === null ? "" : String(preview.suggestedPrice);
    document.getElementById("sales-import-price-confirm").checked = false;
    renderSalesImportMappings(preview);
    document.getElementById("sales-import-preview").style.display = "block";
    updateSalesImportButton();
  }

  function renderSalesImportMappings(preview) {
    const host = document.getElementById("sales-import-mapping");
    host.textContent = "";
    fillMemberAutocompleteDatalist(preview.members);
    const unresolved = preview.customers.filter(function (customer) {
      return !customer.duplicate && customer.matchStatus !== "matched_nik" && customer.matchStatus !== "matched_name";
    });
    if (!unresolved.length) {
      host.textContent = "Semua pelanggan yang belum menjadi duplikat cocok otomatis; tidak ada pemetaan manual.";
      return;
    }

    const table = document.createElement("table");
    table.className = "data-table";
    const thead = document.createElement("thead");
    const headingRow = document.createElement("tr");
    ["Pelanggan sumber", "Tabung", "Status pencocokan", "Pilih anggota bila diketahui"].forEach(function (text) {
      const th = document.createElement("th");
      th.textContent = text;
      headingRow.appendChild(th);
    });
    thead.appendChild(headingRow);
    table.appendChild(thead);
    const body = document.createElement("tbody");
    unresolved.forEach(function (customer) {
      const row = document.createElement("tr");
      const name = document.createElement("td");
      const quantity = document.createElement("td");
      const status = document.createElement("td");
      const choiceCell = document.createElement("td");
      const input = document.createElement("input");
      input.className = "input-text import-member-choice";
      input.type = "text";
      input.setAttribute("list", "member-autocomplete-options");
      input.dataset.customerReportId = customer.customerReportId;
      input.placeholder = "Ketik nama anggota...";
      input.setAttribute("aria-label", "Pilih anggota untuk " + customer.name);
      if (customer.suggestedMemberId && customer.suggestedMemberName) {
        input.value = memberAutocompleteLabel({
          id_anggota: customer.suggestedMemberId,
          nama_lengkap: customer.suggestedMemberName
        });
        input.title = "Saran mapping tersimpan. Periksa dan ubah bila bukan anggota yang benar.";
      }
      name.textContent = customer.name;
      quantity.textContent = String(customer.quantity);
      status.textContent = customer.matchStatus.replace(/_/g, " ") +
        (customer.suggestedMemberId ? " · saran mapping tersimpan" : "");
      choiceCell.appendChild(input);
      row.appendChild(name);
      row.appendChild(quantity);
      row.appendChild(status);
      row.appendChild(choiceCell);
      body.appendChild(row);
    });
    table.appendChild(body);
    host.appendChild(table);
  }

  function formatSalesImportCurrency(value) {
    return "Rp " + Number(value || 0).toLocaleString("id-ID");
  }

  function updateSalesImportButton() {
    const price = Number(document.getElementById("sales-import-price").value);
    document.getElementById("sales-import-commit-button").disabled = !salesImportState || !Number.isInteger(price) || price <= 0;
  }

  function commitSalesImport() {
    if (!salesImportState || !isAdmin || !getAdminToken()) {
      showToast("Pratinjau aktif dan sesi admin diperlukan.", true);
      return;
    }
    const unitPrice = Number(document.getElementById("sales-import-price").value);
    if (!Number.isInteger(unitPrice) || unitPrice <= 0) {
      showToast("Masukkan harga historis berupa bilangan bulat positif.", true);
      return;
    }
    if (!document.getElementById("sales-import-price-confirm").checked) {
      openModal("modal-sales-import-price-warning");
      return;
    }
    if (!confirm("Impor transaksi periode " + salesImportState.preview.period + " dengan harga " + formatSalesImportCurrency(unitPrice) + " per tabung? Penjualan dikelompokkan ke periode Jumat–Kamis menurut tanggal transaksi. Volume batch di luar 20–30 ditandai untuk ditinjau, tidak dipindahkan antarpekan. Duplikat dilewati; pelanggan tanpa pemetaan disimpan untuk tindak lanjut admin.")) return;

    const decisions = {};
    document.querySelectorAll("#sales-import-mapping input[data-customer-report-id]").forEach(function (input) {
      if (!input.value.trim()) {
        decisions[input.dataset.customerReportId] = "";
        return;
      }
      const member = (salesImportState.preview.members || []).find(function (candidate) {
        return memberAutocompleteLabel(candidate) === input.value.trim();
      });
      if (!member) {
        input.focus();
        showToast("Pilih anggota dari saran autocomplete atau kosongkan agar disimpan untuk tindak lanjut.", true);
        return;
      }
      decisions[input.dataset.customerReportId] = member.id_anggota;
    });
    const unresolvedInput = Array.from(document.querySelectorAll("#sales-import-mapping input[data-customer-report-id]")).some(function (input) {
      return input.value.trim() && !decisions[input.dataset.customerReportId];
    });
    if (unresolvedInput) return;
    const button = document.getElementById("sales-import-commit-button");
    button.disabled = true;
    showToast("Mengimpor transaksi dan memperbarui riwayat anggota...");
    appScript.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          button.disabled = false;
          showToast(res && res.message ? res.message : "Impor transaksi gagal.", true);
          return;
        }
        const result = document.getElementById("sales-import-result");
        result.textContent = "Selesai: " + res.importedTransactions + " transaksi, " + res.importedUnits + " tabung, total " + formatSalesImportCurrency(res.totalAmount) + "; " + res.duplicateCount + " duplikat dilewati; " + (res.pendingMappingCount || 0) + " transaksi menunggu mapping admin.";
        if (res.importedBatches && res.importedBatches.length) {
          result.textContent += " Batch Jumat–Kamis: " + res.importedBatches.map(function (batch) {
            return batch.batchId + " (" + batch.date + "–" + batch.periodEnd + ", " + batch.units + " tabung; " + batch.volumeStatus.label + ")";
          }).join(", ") + ". Data ditandai sebagai IMPOR_HISTORIS / IMPOR JSON untuk pengecekan.";
        }
        resetSalesImportForm();
        loadMembersData();
        loadPendingSalesImports();
        loadDashboardData();
        loadBatches();
        loadPublicData();
        showToast("Impor data penjualan selesai.");
      })
      .withFailureHandler(function (err) {
        button.disabled = false;
        showToast(err.message || "Impor transaksi gagal.", true);
      })
      .importSalesFromJson(salesImportState.jsonText, salesImportState.fileName, unitPrice, decisions, getAdminToken());
  }

  function escapeQuotes(str) {
    if (!str) return "";
    return str.replace(/'/g, "\\'");
  }
