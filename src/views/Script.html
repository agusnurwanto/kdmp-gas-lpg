<script>
  // State Global Frontend
  let currentBatches = [];
  let currentQueue = [];
  let allMembersCache = [];
  let selectedBatchId = "";
  let publicQueueCache = [];
  let isAdmin = false;
  let salesImportState = null;
  let activeServerRequests = 0;
  let settingsCacheTimer = null;
  let localLogoPreviewUrl = "";
  let disabledButtonsDuringRequest = [];
  let appSettingsLoaded = false;
  let adminDataLoaded = false;

  const SETTINGS_CACHE_KEY = "KDMP_APP_SETTINGS_V1";
  const SETTINGS_CACHE_TTL = 10 * 60 * 1000;

  function beginServerRequest() {
    if (activeServerRequests === 0) {
      const buttons = document.querySelectorAll(".app-container button");
      disabledButtonsDuringRequest = [];
      buttons.forEach(function (button) {
        disabledButtonsDuringRequest.push({ button: button, wasDisabled: button.disabled });
        button.disabled = true;
      });
    }
    activeServerRequests++;
    if (settingsCacheTimer) {
      clearTimeout(settingsCacheTimer);
      settingsCacheTimer = null;
    }
    const overlay = document.getElementById("app-loading-overlay");
    if (overlay) overlay.classList.add("show");
    const app = document.querySelector(".app-container");
    if (app) {
      app.setAttribute("aria-busy", "true");
      app.inert = true;
    }
  }

  function endServerRequest() {
    activeServerRequests = Math.max(0, activeServerRequests - 1);
    if (activeServerRequests || settingsCacheTimer) return;
    settingsCacheTimer = setTimeout(function () {
      settingsCacheTimer = null;
      if (activeServerRequests) return;
      const overlay = document.getElementById("app-loading-overlay");
      if (overlay) overlay.classList.remove("show");
      const app = document.querySelector(".app-container");
      if (app) {
        app.removeAttribute("aria-busy");
        app.inert = false;
      }
      disabledButtonsDuringRequest.forEach(function (entry) {
        if (entry.button.disabled) entry.button.disabled = entry.wasDisabled;
      });
      disabledButtonsDuringRequest = [];
    }, 120);
  }

  function trackedGoogleScriptRun(successHandler, failureHandler, userObject) {
    const runner = window.google.script.run;
    return new Proxy({}, {
      get: function (_, property) {
        if (property === "withSuccessHandler") {
          return function (handler) { return trackedGoogleScriptRun(handler, failureHandler, userObject); };
        }
        if (property === "withFailureHandler") {
          return function (handler) { return trackedGoogleScriptRun(successHandler, handler, userObject); };
        }
        if (property === "withUserObject") {
          return function (userObject) {
            return trackedGoogleScriptRun(successHandler, failureHandler, userObject);
          };
        }
        return function () {
          const args = Array.prototype.slice.call(arguments);
          beginServerRequest();
          let completed = false;
          function complete() {
            if (completed) return;
            completed = true;
            endServerRequest();
          }
          const ok = function () {
            try {
              if (successHandler) successHandler.apply(null, arguments);
            } finally {
              complete();
            }
          };
          const fail = function (error) {
            try {
              if (failureHandler) failureHandler.apply(null, arguments);
              else {
                console.error("Apps Script request failed:", error);
                showToast(error && error.message ? error.message : "Permintaan ke server gagal.", true);
              }
            } finally {
              complete();
            }
          };
          let configured = runner.withSuccessHandler(ok).withFailureHandler(fail);
          if (userObject !== undefined) configured = configured.withUserObject(userObject);
          try {
            configured[property].apply(configured, args);
          } catch (error) {
            complete();
            throw error;
          }
        };
      }
    });
  }

  const appScript = { get run() { return trackedGoogleScriptRun(); } };

  function readCachedAppSettings() {
    try {
      const cached = JSON.parse(localStorage.getItem(SETTINGS_CACHE_KEY) || "null");
      if (!cached || !cached.settings || !cached.expiresAt) return null;
      return { settings: cached.settings, fresh: Date.now() < cached.expiresAt };
    } catch (error) {
      return null;
    }
  }

  function cacheAppSettings(settings) {
    try {
      localStorage.setItem(SETTINGS_CACHE_KEY, JSON.stringify({
        settings: settings,
        expiresAt: Date.now() + SETTINGS_CACHE_TTL
      }));
    } catch (error) {
      console.warn("Pengaturan tidak dapat disimpan ke cache browser:", error);
    }
  }

  // Pengaturan Aplikasi dari Database (default sebelum dimuat)
  let appSettings = {
    HARGA_PER_TABUNG: "20000",
    KUOTA_PER_BATCH: "25",
    NAMA_KOPERASI: "Koperasi Desa Merah Putih (KDMP) Desa Gulun"
  };

  function getHargaFormatted() {
    const harga = parseInt(appSettings.HARGA_PER_TABUNG) || 20000;
    return "Rp " + harga.toLocaleString("id-ID");
  }

  // Inisialisasi saat halaman dimuat
  document.addEventListener("DOMContentLoaded", function () {
    initSalesImportControls();
    initCooperativeSettingsControls();
    initApp();
  });

  function initApp() {
    checkAuth();
    const cached = readCachedAppSettings();
    if (cached) {
      appSettings = cached.settings;
      applySettingsToUI();
      initializeDataViews();
      if (cached.fresh) return;
    }
    appScript.run
      .withSuccessHandler(function (settings) {
        if (settings) {
          appSettings = settings;
          cacheAppSettings(settings);
        }
        applySettingsToUI();
        appSettingsLoaded = true;
        if (!cached) initializeDataViews();
        else loadAdminDataOnce();
      })
      .withFailureHandler(function (error) {
        // Gunakan default jika gagal
        applySettingsToUI();
        appSettingsLoaded = true;
        if (!cached) initializeDataViews();
        else loadAdminDataOnce();
        console.error("Gagal memuat pengaturan:", error);
        showToast(error && error.message ? error.message : "Pengaturan belum dapat dimuat dari server.", true);
      })
      .getAppSettings();
  }

  function initializeDataViews() {
    appSettingsLoaded = true;
    loadPublicData();
    loadAdminDataOnce();
  }

  function loadAdminDataOnce() {
    if (!isAdmin || !appSettingsLoaded || adminDataLoaded) return;
    adminDataLoaded = true;
    loadBatches();
    loadDashboardData();
    loadMembersData();
  }

  function clearExpiredAdminSession(message) {
    sessionStorage.removeItem("KDMP_ADMIN_TOKEN");
    isAdmin = false;
    adminDataLoaded = false;
    updateAuthUI();
    showToast(message || "Sesi admin berakhir. Silakan login kembali.", true);
  }

  function applySettingsToUI() {
    // Update harga di semua elemen yang menampilkan harga
    const hargaFmt = getHargaFormatted();
    var priceEls = document.querySelectorAll(".dynamic-price");
    for (var i = 0; i < priceEls.length; i++) {
      priceEls[i].textContent = hargaFmt;
    }
    // Update harga default di input modal pickup
    var pickupPrice = document.getElementById("pickup-price");
    if (pickupPrice) pickupPrice.value = appSettings.HARGA_PER_TABUNG || "20000";

    const cooperativeName = appSettings.NAMA_KOPERASI || "Koperasi Desa Merah Putih (KDMP) Desa Gulun";
    const nameInput = document.getElementById("setting-org-name");
    if (nameInput) nameInput.value = cooperativeName;
    const brandSubtitle = document.getElementById("brand-subtitle");
    if (brandSubtitle) brandSubtitle.textContent = cooperativeName;
    const brandBadge = document.getElementById("brand-badge");
    const brandLogo = document.getElementById("brand-logo");
    const logoPreview = document.getElementById("setting-org-logo-preview");
    const emptyPreview = document.getElementById("setting-org-logo-empty");
    const logoUrl = appSettings.LOGO_DATA_URL || appSettings.LOGO_URL || "";
    if (brandLogo) {
      brandLogo.hidden = !logoUrl;
      if (logoUrl) brandLogo.src = logoUrl;
      else brandLogo.removeAttribute("src");
    }
    if (brandBadge) {
      brandBadge.textContent = cooperativeName;
      brandBadge.hidden = !!logoUrl;
    }
    if (logoPreview) {
      logoPreview.hidden = !logoUrl;
      if (logoUrl) logoPreview.src = logoUrl;
      else logoPreview.removeAttribute("src");
    }
    if (emptyPreview) emptyPreview.hidden = !!logoUrl;
    const orgName = document.getElementById("public-org-name");
    if (orgName) orgName.textContent = cooperativeName;
    const orgDescription = document.getElementById("public-org-description");
    if (orgDescription) orgDescription.textContent = cooperativeName;
    const orgLocation = document.getElementById("public-org-location");
    if (orgLocation) orgLocation.textContent = "Kantor " + cooperativeName;
    const loginOrg = document.getElementById("login-org-name");
    if (loginOrg) loginOrg.textContent = cooperativeName;
    const membersOrg = document.getElementById("members-org-name");
    if (membersOrg) membersOrg.textContent = cooperativeName;
    document.title = cooperativeName + " - Sistem Distribusi Gas LPG";
  }

  function initCooperativeSettingsControls() {
    const fileInput = document.getElementById("setting-org-logo");
    if (!fileInput) return;
    fileInput.addEventListener("change", function () {
      const file = fileInput.files && fileInput.files[0];
      const preview = document.getElementById("setting-org-logo-preview");
      const empty = document.getElementById("setting-org-logo-empty");
      if (!file) {
        applySettingsToUI();
        return;
      }
      if (["image/png", "image/jpeg", "image/webp"].indexOf(file.type) === -1 || file.size > 1024 * 1024) {
        fileInput.value = "";
        showToast("Logo harus PNG, JPEG, atau WebP dengan ukuran maksimal 1 MB.", true);
        return;
      }
      if (preview) {
        if (localLogoPreviewUrl) URL.revokeObjectURL(localLogoPreviewUrl);
        localLogoPreviewUrl = URL.createObjectURL(file);
        preview.src = localLogoPreviewUrl;
        preview.hidden = false;
      }
      if (empty) empty.hidden = true;
    });
  }

  function saveCooperativeSettings() {
    if (!isAdmin || !getAdminToken()) {
      showToast("Login admin diperlukan untuk mengubah identitas koperasi.", true);
      return;
    }
    const nameInput = document.getElementById("setting-org-name");
    const fileInput = document.getElementById("setting-org-logo");
    const button = document.getElementById("save-org-settings-button");
    const name = nameInput.value.trim();
    const file = fileInput.files && fileInput.files[0];
    if (name.length < 3 || name.length > 100) {
      showToast("Nama koperasi harus berisi 3 sampai 100 karakter.", true);
      return;
    }
    if (file && (["image/png", "image/jpeg", "image/webp"].indexOf(file.type) === -1 || file.size > 1024 * 1024)) {
      showToast("Logo harus PNG, JPEG, atau WebP dengan ukuran maksimal 1 MB.", true);
      return;
    }

    button.disabled = true;
    const sendSettings = function (logoDataUrl) {
      appScript.run
        .withSuccessHandler(function (result) {
          button.disabled = false;
          if (!result || !result.success) {
            if (result && result.code === 403) {
              clearExpiredAdminSession("Sesi admin berakhir. Silakan login kembali untuk menyimpan identitas.");
              return;
            }
            showToast(result && result.message ? result.message : "Pengaturan identitas gagal disimpan.", true);
            return;
          }
          appSettings = result.settings;
          cacheAppSettings(appSettings);
          if (localLogoPreviewUrl) {
            URL.revokeObjectURL(localLogoPreviewUrl);
            localLogoPreviewUrl = "";
          }
          applySettingsToUI();
          fileInput.value = "";
          showToast(result.message || "Identitas koperasi berhasil disimpan.");
        })
        .withFailureHandler(function (error) {
          button.disabled = false;
          showToast(error && error.message ? error.message : "Pengaturan identitas gagal disimpan.", true);
        })
        .saveCooperativeSettings(name, logoDataUrl, getAdminToken());
    };

    if (!file) {
      sendSettings("");
      return;
    }
    const reader = new FileReader();
    reader.onload = function () { sendSettings(String(reader.result || "")); };
    reader.onerror = function () {
      button.disabled = false;
      showToast("File logo tidak dapat dibaca oleh browser.", true);
    };
    reader.readAsDataURL(file);
  }

  // ==========================================
  // AUTENTIKASI ADMIN & SESSI PENGURUS
  // ==========================================

  function checkAuth() {
    const token = sessionStorage.getItem("KDMP_ADMIN_TOKEN");
    isAdmin = false;
    updateAuthUI();
    if (!token) return;

    appScript.run
      .withSuccessHandler(function (result) {
        if (!result || !result.success) {
          clearExpiredAdminSession("Sesi admin tidak valid atau sudah berakhir. Silakan login kembali.");
          return;
        }
        isAdmin = true;
        updateAuthUI();
        loadAdminDataOnce();
      })
      .withFailureHandler(function (error) {
        clearExpiredAdminSession(error && error.message ? error.message : "Sesi admin tidak dapat diverifikasi. Silakan login kembali.");
      })
      .validateAdminSession(token);
  }

  function updateAuthUI() {
    const adminTabs = document.querySelectorAll(".admin-tab");
    const btnLogin = document.getElementById("btn-login-modal");
    const adminBadge = document.getElementById("admin-badge-group");

    // Tab publik: tab-public-home dan tab-dashboard
    var adminOnlyTabs = ["tab-queue", "tab-members", "tab-sales-import", "tab-settings"];

    if (isAdmin) {
      adminTabs.forEach(function (t) { t.style.display = "inline-block"; });
      if (btnLogin) btnLogin.style.display = "none";
      if (adminBadge) adminBadge.style.display = "flex";
      // Tampilkan kolom WA dan tombol CSV
      var waCol = document.getElementById("report-col-wa");
      if (waCol) waCol.style.display = "";
      var csvBtn = document.getElementById("btn-export-csv");
      if (csvBtn) csvBtn.style.display = "";
    } else {
      adminTabs.forEach(function (t) { t.style.display = "none"; });
      if (btnLogin) btnLogin.style.display = "inline-block";
      if (adminBadge) adminBadge.style.display = "none";
      // Sembunyikan kolom WA dan tombol CSV untuk publik
      var waCol = document.getElementById("report-col-wa");
      if (waCol) waCol.style.display = "none";
      var csvBtn = document.getElementById("btn-export-csv");
      if (csvBtn) csvBtn.style.display = "none";

      // Jika tab aktif saat ini adalah tab admin-only, kembalikan ke public home
      var currentActive = document.querySelector(".tab-pane.active");
      if (currentActive && adminOnlyTabs.indexOf(currentActive.id) !== -1) {
        switchTab("tab-public-home");
      }
    }
    // Setelah update auth, render ulang tabel laporan jika ada cache
    if (allMembersCache.length > 0) renderReportTable(allMembersCache);
  }

  function openLoginModal() {
    document.getElementById("login-pin-input").value = "";
    openModal("modal-login");
    setTimeout(() => {
      document.getElementById("login-pin-input").focus();
    }, 200);
  }

  function submitLoginAdmin() {
    const pin = document.getElementById("login-pin-input").value;
    if (!pin) {
      showToast("Harap masukkan PIN Admin.", true);
      return;
    }

    showToast("Memverifikasi PIN Admin...");
    appScript.run
      .withSuccessHandler(function (res) {
        if (res.success) {
          sessionStorage.setItem("KDMP_ADMIN_TOKEN", res.token);
          isAdmin = true;
          adminDataLoaded = false;
          closeModal("modal-login");
          updateAuthUI();
          showToast(res.message);

          // Muat data admin dan pindah ke tab antrian
          loadAdminDataOnce();
          switchTab("tab-queue");
        } else {
          showToast(res.message, true);
        }
      })
      .withFailureHandler(function (err) {
        showToast(err.message, true);
      })
      .loginAdmin(pin);
  }

  function logoutAdmin() {
    const token = sessionStorage.getItem("KDMP_ADMIN_TOKEN");
    // Hapus session di server terlebih dahulu
    if (token) {
      appScript.run.logoutAdmin(token);
    }
    sessionStorage.removeItem("KDMP_ADMIN_TOKEN");
    isAdmin = false;
    updateAuthUI();
    switchTab("tab-public-home");
    showToast("Anda telah keluar dari mode admin.");
  }

  /**
   * Mendapatkan session token admin dari sessionStorage.
   * Token ini dikirim ke server untuk memvalidasi bahwa user sudah login.
   */
  function getAdminToken() {
    return sessionStorage.getItem("KDMP_ADMIN_TOKEN") || "";
  }

  function submitChangePin() {
    const oldPin = document.getElementById("input-old-pin").value;
    const newPin = document.getElementById("input-new-pin").value;

    if (!oldPin || !newPin) {
      alert("Harap isi PIN Lama dan PIN Baru.");
      return;
    }

    appScript.run
      .withSuccessHandler(function (res) {
        if (res.success) {
          showToast(res.message);
          document.getElementById("input-old-pin").value = "";
          document.getElementById("input-new-pin").value = "";
        } else {
          showToast(res.message, true);
        }
      })
      .withFailureHandler(function (err) {
        showToast(err.message, true);
      })
      .changeAdminPin(oldPin, newPin);
  }

  // ==========================================
  // NAVIGASI TAB & UI UTILS
  // ==========================================

  // Tab yang hanya boleh diakses admin
  var ADMIN_ONLY_TABS = ["tab-queue", "tab-members", "tab-sales-import", "tab-settings"];

  function switchTab(tabId) {
    // Validasi hak akses jika tab admin-only dibuka oleh tamu
    if (ADMIN_ONLY_TABS.indexOf(tabId) !== -1 && !isAdmin) {
      openLoginModal();
      return;
    }

    document.querySelectorAll(".tab-pane").forEach(function (el) { el.classList.remove("active"); });
    document.querySelectorAll(".tab-btn").forEach(function (el) { el.classList.remove("active"); });

    var targetTab = document.getElementById(tabId);
    if (targetTab) targetTab.classList.add("active");

    var activeBtn = Array.from(document.querySelectorAll(".tab-btn")).find(function (btn) {
      return btn.getAttribute("onclick") && btn.getAttribute("onclick").includes(tabId);
    });
    if (activeBtn) activeBtn.classList.add("active");

    var navMenu = document.querySelector(".nav-menu");
    if (navMenu && window.matchMedia("(max-width: 768px)").matches) navMenu.open = false;

    if (tabId === "tab-public-home") loadPublicData();
    if (tabId === "tab-dashboard") loadDashboardData();
    if (tabId === "tab-members" && isAdmin) loadMembersData();
    if (tabId === "tab-queue" && isAdmin && selectedBatchId) loadQueueData();
  }

  function showToast(message, isError = false) {
    const toast = document.getElementById("app-toast");
    toast.textContent = (isError ? "❌ " : "✅ ") + message;
    toast.style.background = isError ? "var(--danger)" : "var(--secondary)";
    toast.classList.add("show");
    setTimeout(() => {
      toast.classList.remove("show");
    }, 4000);
  }

  function openModal(modalId) {
    const m = document.getElementById(modalId);
    if (m) m.classList.add("show");
  }

  function closeModal(modalId) {
    const m = document.getElementById(modalId);
    if (m) m.classList.remove("show");
  }

  // ==========================================
  // BERANDA PUBLIK (UNTUK WARGA / UMUM)
  // ==========================================

  // Cache semua batch untuk dropdown filter publik
  var allBatchesCache = [];

  function loadPublicData() {
    appScript.run
      .withSuccessHandler(function (summary) {
        document.getElementById("public-stat-month-quota").textContent =
          (summary.totalGasDistributedMonth || 0) + " / " + (summary.monthlyTargetQuota || 100) + " Tabung";
        document.getElementById("public-stat-served-count").textContent =
          (summary.servedCountMonth || 0) + " Warga";

        if (summary.recentBatches && summary.recentBatches.length > 0) {
          // Populate dropdown filter batch
          populateBatchFilter(summary.recentBatches);

          var latestBatch = summary.recentBatches[0];
          document.getElementById("public-stat-batch-date").textContent = latestBatch.tgl_jadwal;
          document.getElementById("public-stat-batch-time").textContent = latestBatch.hari + ", " + latestBatch.waktu_kirim;
          document.getElementById("public-stat-batch-stock").textContent = latestBatch.sisa_stok + " Tabung";
          document.getElementById("public-stat-batch-progress").textContent = "Terambil: " + latestBatch.jumlah_terambil + " / " + latestBatch.jumlah_stok;
          document.getElementById("public-batch-caption").textContent =
            "Batch: " + latestBatch.id_batch + " \u2022 Jadwal: " + latestBatch.tgl_jadwal + " (" + latestBatch.waktu_kirim + ")";

          // Jika dropdown sudah ada nilai terpilih, gunakan itu; jika tidak, gunakan batch terbaru
          var filterEl = document.getElementById("public-batch-filter");
          var batchToLoad = (filterEl && filterEl.value) ? filterEl.value : latestBatch.id_batch;
          loadPublicQueue(batchToLoad);
        } else {
          document.getElementById("public-stat-batch-date").textContent = "Belum Ada";
          document.getElementById("public-stat-batch-stock").textContent = "0 Tabung";
          document.getElementById("public-batch-caption").textContent = "Belum ada jadwal batch pengiriman aktif.";
          var filterEl = document.getElementById("public-batch-filter");
          if (filterEl) filterEl.innerHTML = "<option value=''>Belum ada batch</option>";
          renderPublicQueueTable([]);
        }
      })
      .withFailureHandler(function (err) {
        console.error("Gagal memuat ringkasan publik:", err);
        showToast(err && err.message ? err.message : "Ringkasan publik gagal dimuat.", true);
      })
      .getDashboardSummary();
  }

  function populateBatchFilter(batches) {
    allBatchesCache = batches;
    var filterEl = document.getElementById("public-batch-filter");
    if (!filterEl) return;
    var currentVal = filterEl.value;
    filterEl.innerHTML = "";
    batches.forEach(function (b, idx) {
      var opt = document.createElement("option");
      opt.value = b.id_batch;
      var label = "\uD83D\uDCC5 " + b.tgl_jadwal + " (" + b.hari + ", " + b.waktu_kirim + ")";
      if (idx === 0) label += " — Terbaru";
      var done = parseInt(b.jumlah_terambil) || 0;
      var total = parseInt(b.jumlah_stok) || 25;
      label += " [" + done + "/" + total + " terambil]";
      opt.textContent = label;
      if (currentVal ? b.id_batch === currentVal : idx === 0) opt.selected = true;
      filterEl.appendChild(opt);
    });
  }

  function onPublicBatchFilterChange() {
    var filterEl = document.getElementById("public-batch-filter");
    var batchId = filterEl ? filterEl.value : "";
    if (!batchId) return;

    // Update info batch card sesuai pilihan
    var selected = allBatchesCache.find(function (b) { return b.id_batch === batchId; });
    if (selected) {
      document.getElementById("public-stat-batch-date").textContent = selected.tgl_jadwal;
      document.getElementById("public-stat-batch-time").textContent = selected.hari + ", " + selected.waktu_kirim;
      document.getElementById("public-stat-batch-stock").textContent = selected.sisa_stok + " Tabung";
      document.getElementById("public-stat-batch-progress").textContent = "Terambil: " + selected.jumlah_terambil + " / " + selected.jumlah_stok;
      document.getElementById("public-batch-caption").textContent =
        "Batch: " + selected.id_batch + " \u2022 Jadwal: " + selected.tgl_jadwal + " (" + selected.waktu_kirim + ")";
    }

    // Reset search lalu muat antrian batch yang dipilih
    var searchEl = document.getElementById("public-search-input");
    if (searchEl) searchEl.value = "";
    loadPublicQueue(batchId);
  }

  function loadPublicQueue(batchId) {
    var tbody = document.getElementById("public-queue-table-body");
    if (tbody) tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;padding:20px;color:var(--text-muted);'>Memuat antrian...</td></tr>";
    appScript.run
      .withSuccessHandler(function (queueList) {
        publicQueueCache = queueList || [];
        renderPublicQueueTable(publicQueueCache);
      })
      .withFailureHandler(function (err) {
        console.error("Gagal memuat antrian publik:", err);
        showToast(err && err.message ? err.message : "Antrian publik gagal dimuat.", true);
      })
      .getQueueByBatch(batchId);
  }

  function renderPublicQueueTable(items) {
    var tbody = document.getElementById("public-queue-table-body");
    tbody.innerHTML = "";

    if (!items || items.length === 0) {
      tbody.innerHTML = "<tr><td colspan='5' style='text-align: center; padding: 25px; color: var(--text-muted);'>Belum ada antrian yang dibuat untuk batch ini.</td></tr>";
      return;
    }

    items.forEach(function (item) {
      var tr = document.createElement("tr");
      var isDone = item.status_antrian === "SUDAH_DIAMBIL";
      var statusBadge = isDone
        ? "<span class='kpi-badge badge-success'>&#10003; Sudah Diambil</span>"
        : "<span class='kpi-badge badge-accent'>&#9203; Menunggu Ambil</span>";

      var note = "-";
      if (isDone && item.waktu_ambil) {
        note = "Diambil: " + item.waktu_ambil;
      } else if (item.is_replaced && item.keterangan_penyesuaian) {
        note = "Pengganti: " + item.keterangan_penyesuaian;
      }

      tr.innerHTML =
        "<td style='text-align:center;font-weight:800;color:var(--secondary);'>#" + item.no_urut + "</td>" +
        "<td style='font-weight:700;'>" + item.nama_anggota_penerima + "</td>" +
        "<td>" + item.rt_rw_penerima + "</td>" +
        "<td style='text-align:center;'>" + statusBadge + "</td>" +
        "<td style='font-size:12px;color:var(--text-muted);'>" + note + "</td>";
      tbody.appendChild(tr);
    });
  }

  function filterPublicQueue() {
    var query = document.getElementById("public-search-input").value.toLowerCase().trim();
    if (!query) {
      renderPublicQueueTable(publicQueueCache);
      return;
    }
    var filtered = publicQueueCache.filter(function (item) {
      return item.nama_anggota_penerima.toLowerCase().includes(query) ||
        item.id_anggota_penerima.toLowerCase().includes(query) ||
        item.rt_rw_penerima.toLowerCase().includes(query);
    });
    renderPublicQueueTable(filtered);
  }

  // ==========================================
  // MANAJEMEN BATCH & ANTRIAN (ADMIN ONLY)
  // ==========================================

  function loadBatches() {
    if (!isAdmin) return;
    appScript.run
      .withSuccessHandler(function (batches) {
        currentBatches = batches || [];
        const select = document.getElementById("select-batch");
        select.innerHTML = "";

        if (currentBatches.length === 0) {
          select.innerHTML = "<option value=''>Belum ada batch. Buat batch baru!</option>";
          document.getElementById("queue-empty").style.display = "block";
          document.getElementById("queue-loading").style.display = "none";
          return;
        }

        currentBatches.forEach((b, index) => {
          const opt = document.createElement("option");
          opt.value = b.id_batch;
          opt.textContent = `${b.id_batch} - ${b.tgl_jadwal} (${b.hari}, ${b.waktu_kirim}) [Stok: ${b.sisa_stok}/${b.jumlah_stok}]`;
          if (index === 0) opt.selected = true;
          select.appendChild(opt);
        });

        selectedBatchId = select.value;
        updateBatchInfoCard();
        loadQueueData();
      })
      .withFailureHandler(function (err) {
        showToast(err.message, true);
      })
      .getAllBatches();
  }

  function updateBatchInfoCard() {
    const batch = currentBatches.find(b => b.id_batch === selectedBatchId);
    const card = document.getElementById("batch-info-card");
    if (!batch) {
      card.style.display = "none";
      return;
    }

    card.style.display = "block";
    document.getElementById("batch-title").textContent = `Batch Gas LPG: ${batch.tgl_jadwal} (${batch.hari}, ${batch.waktu_kirim})`;
    document.getElementById("batch-details").textContent = `ID: ${batch.id_batch} • Status: ${batch.status_batch}`;
    document.getElementById("batch-total-stok").textContent = batch.jumlah_stok + " Tabung";
    document.getElementById("batch-terambil").textContent = batch.jumlah_terambil + " Terambil";
    document.getElementById("batch-sisa").textContent = batch.sisa_stok + " Sisa";
  }

  function loadQueueData() {
    if (!isAdmin) return;
    const select = document.getElementById("select-batch");
    selectedBatchId = select.value;
    if (!selectedBatchId) return;

    updateBatchInfoCard();

    document.getElementById("queue-loading").style.display = "block";
    document.getElementById("queue-cards-grid").style.display = "none";
    document.getElementById("queue-empty").style.display = "none";

    appScript.run
      .withSuccessHandler(function (queueList) {
        document.getElementById("queue-loading").style.display = "none";
        currentQueue = queueList || [];

        if (currentQueue.length === 0) {
          document.getElementById("queue-empty").style.display = "block";
          return;
        }

        renderQueueCards(currentQueue);
      })
      .withFailureHandler(function (err) {
        document.getElementById("queue-loading").style.display = "none";
        showToast(err.message, true);
      })
      .getQueueByBatch(selectedBatchId);
  }

  function renderQueueCards(items) {
    const grid = document.getElementById("queue-cards-grid");
    grid.innerHTML = "";
    grid.style.display = "grid";

    const batch = currentBatches.find(b => b.id_batch === selectedBatchId);
    const batchDateStr = batch ? `${batch.tgl_jadwal} (${batch.waktu_kirim})` : "Jumat Sore";

    items.forEach(item => {
      const card = document.createElement("div");
      let statusClass = "status-menunggu";
      let statusBadge = "<span class='kpi-badge badge-accent'>Menunggu</span>";

      if (item.status_antrian === "SUDAH_DIAMBIL") {
        statusClass = "status-sudah";
        statusBadge = "<span class='kpi-badge badge-success'>✓ Sudah Diambil</span>";
      } else if (item.status_antrian === "DIGANTIKAN") {
        statusClass = "status-digantikan";
        statusBadge = "<span class='kpi-badge badge-warning'>Ditukar Penerima</span>";
      } else if (item.status_antrian === "BATAL_LEWAT") {
        statusClass = "status-batal";
        statusBadge = "<span class='kpi-badge' style='background:#FEE2E2; color:#DC2626;'>Dibatalkan</span>";
      }

      card.className = `queue-card ${statusClass}`;
      card.id = `card-queue-${item.id_antrian}`;

      let replacedHtml = "";
      if (item.is_replaced) {
        replacedHtml = `
          <div class="queue-replaced-info">
            ⚠️ <em>Jatah Asli:</em> <strong>${item.nama_anggota_asli}</strong><br>
            <span style="font-size: 10px;">${item.keterangan_penyesuaian}</span>
          </div>
        `;
      }

      // Keterangan status WA terakhir
      const hasWa = item.waktu_terakhir_wa && item.waktu_terakhir_wa !== "-";
      const waBadge = hasWa
        ? `<span id="wa-badge-${item.id_antrian}" class="kpi-badge badge-success" style="font-size: 11px;">📱 WA: ${item.waktu_terakhir_wa}</span>`
        : `<span id="wa-badge-${item.id_antrian}" class="kpi-badge" style="font-size: 11px; background:#F1F5F9; color:#64748B;">📱 Belum di-WA</span>`;

      let actionsHtml = "";
      if (item.status_antrian !== "SUDAH_DIAMBIL") {
        actionsHtml = `
          <div class="queue-actions" style="flex-wrap: wrap;">
            <button class="btn btn-outline btn-sm" style="color:#0284C7;" onclick="sendPersonalWaReminder('${item.id_antrian}', '${item.no_whatsapp}', '${escapeQuotes(item.nama_anggota_penerima)}', ${item.no_urut}, '${escapeQuotes(batchDateStr)}')">
              💬 Kirim WA
            </button>
            <button class="btn btn-outline btn-sm" onclick="openSwapModal('${item.id_antrian}', ${item.no_urut}, '${escapeQuotes(item.nama_anggota_penerima)}')">⇄ Tukar</button>
            <button class="btn btn-outline btn-sm" onclick="openReplaceModal('${item.id_antrian}', '${item.id_anggota_penerima}')">✎ Ganti Orang</button>
            <button class="btn btn-success btn-sm" onclick="openPickupModal('${item.id_antrian}', ${item.no_urut}, '${escapeQuotes(item.nama_anggota_penerima)}', '${escapeQuotes(item.rt_rw_penerima)}')">✓ Ambil & Bayar</button>
          </div>
        `;
      } else {
        actionsHtml = `
          <div class="queue-actions">
            <span style="font-size: 11px; color: var(--success); font-weight: 600;">Diambil: ${item.waktu_ambil}</span>
          </div>
        `;
      }

      card.innerHTML = `
        <div>
          <div class="queue-header">
            <div class="queue-number">#${item.no_urut}</div>
            <div style="display: flex; gap: 6px; align-items: center;">
              ${waBadge}
              ${statusBadge}
            </div>
          </div>
          <div class="queue-member-name">${item.nama_anggota_penerima}</div>
          <div class="queue-member-sub">${item.id_anggota_penerima} • ${item.rt_rw_penerima}</div>
          <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">WA: ${item.no_whatsapp || "-"}</div>
          ${replacedHtml}
        </div>
        ${actionsHtml}
      `;

      grid.appendChild(card);
    });
  }

  // ==========================================
  // FITUR KIRIM WHATSAPP PENGINGAT PERSONAL

  function sendPersonalWaReminder(queueId, phone, name, noUrut, batchDate) {
    if (!phone || phone === "-" || phone.trim() === "") {
      alert("Nomor WhatsApp untuk " + name + " belum terdaftar. Silakan lengkapi kontak di menu Data Anggota.");
      return;
    }

    // Bersihkan nomor HP
    var cleanPhone = phone.replace(/[^0-9]/g, "");
    if (cleanPhone.startsWith("0")) {
      cleanPhone = "62" + cleanPhone.substring(1);
    }

    // Harga dari pengaturan database
    var hargaFmt = getHargaFormatted();

    // Template pesan WhatsApp resmi & ramah (tanpa template literal untuk hindari parse error GAS)
    var msg = "Halo Bpk/Ibu *" + name + "*,\n\n";
    msg += "Kami dari *" + appSettings.NAMA_KOPERASI + "* ingin menginformasikan bahwa pasokan gas LPG 3kg telah tiba di pangkalan.\n\n";
    msg += "\u{1F4CB} *No. Antrian Anda:* #" + noUrut + "\n";
    msg += "\u{1F4C5} *Jadwal Pengambilan:* " + batchDate + "\n";
    msg += "\u{1F4CD} *Lokasi:* Kantor " + appSettings.NAMA_KOPERASI + "\n";
    msg += "\u{1F4B0} *Harga Resmi:* " + hargaFmt + " / tabung\n\n";
    msg += "Mohon kesediaannya untuk *segera mengambil tabung gas* di lokasi dengan membawa 1 tabung kosong dalam kondisi baik.\n\n";
    msg += "Terima kasih atas kerja samanya! \u{1F64F}\n";
    msg += "_Pengurus " + appSettings.NAMA_KOPERASI + "_";

    var waUrl = "https://api.whatsapp.com/send?phone=" + cleanPhone + "&text=" + encodeURIComponent(msg);
    window.open(waUrl, "_blank");

    // Catat waktu pengiriman ke server Spreadsheet secara instan
    var capturedName = name;
    var capturedQueueId = queueId;
    appScript.run
      .withSuccessHandler(function (res) {
        showToast("Pesan WA pengingat telah dikirim ke " + capturedName + "!");
        // Update badge UI secara langsung
        var badge = document.getElementById("wa-badge-" + capturedQueueId);
        if (badge) {
          badge.className = "kpi-badge badge-success";
          badge.textContent = "\u{1F4F1} WA: " + (res ? res.timestamp : "-");
        }
      })
      .withFailureHandler(function (err) {
        console.error("Gagal mencatat timestamp WA:", err);
        showToast(err && err.message ? err.message : "Pesan terkirim, tetapi waktu pengiriman gagal dicatat.", true);
      })
      .recordWaSent(capturedQueueId, getAdminToken());
  }

    if (confirm(`Generate 25 antrian otomatis untuk ${selectedBatchId} berdasarkan urutan prioritas adil?`)) {

  // Buat Batch Modal
  function openNewBatchModal() {
    const today = new Date();
    const day = today.getDay();
    const diff = (5 - day + 7) % 7;
    today.setDate(today.getDate() + (diff === 0 ? 7 : diff));
    const nextFriday = today.toISOString().split("T")[0];

    document.getElementById("new-batch-date").value = nextFriday;
    openModal("modal-new-batch");
  }

  function submitNewBatch() {
    const date = document.getElementById("new-batch-date").value;
    const time = document.getElementById("new-batch-time").value;
    const quota = document.getElementById("new-batch-quota").value;

    if (!date) {
      alert("Harap pilih tanggal jadwal kedatangan.");

    appScript.run
      .withSuccessHandler(function (res) {

        showToast(res.message);
        loadBatches();
        loadPublicData();
      })
      .withFailureHandler(function (err) {
        showToast(err.message, true);
      })
      .createBatch(date, time, quota, getAdminToken());

  function renderReportTable(members) {
    var tbody = document.getElementById("report-table-body");
    if (!tbody) return;
    tbody.innerHTML = "";

    if (!members || members.length === 0) {
      tbody.innerHTML = "<tr><td colspan='8' style='text-align: center; padding: 20px;'>Tidak ada data anggota.</td></tr>";
      return;
    }

    // Urutkan: belum dapat (prioritas) duluan, kemudian sudah dapat diurutkan abjad nama
    var sorted = members.slice().sort(function (a, b) {
      if (a.total_beli_bulan_ini === 0 && b.total_beli_bulan_ini > 0) return -1;
      if (a.total_beli_bulan_ini > 0 && b.total_beli_bulan_ini === 0) return 1;
      return a.nama_lengkap.localeCompare(b.nama_lengkap, "id");
    });

    // Update badge count
    var countBadge = document.getElementById("report-count-badge");
    if (countBadge) countBadge.textContent = sorted.length + " anggota";

    sorted.forEach(function (m) {
      var tr = document.createElement("tr");
      var isServed = m.total_beli_bulan_ini > 0;
      var statusBadge = isServed
        ? "<span class='kpi-badge badge-success'>&#10003; Sudah Ambil (" + m.total_beli_bulan_ini + ")</span>"
        : "<span class='kpi-badge badge-primary'>&#9203; Belum Dapat (Prioritas)</span>";

      tr.innerHTML =
        "<td><strong>" + m.id_anggota + "</strong></td>" +
        "<td style='font-weight:600;'>" + m.nama_lengkap + "</td>" +
        "<td>" + m.no_ktp || "-" + "</td>" +
        "<td>" + m.rt_rw + "</td>" +
        (isAdmin ? "<td>" + (m.no_whatsapp || "-") + "</td>" : "") +
        "<td style='text-align:center;font-weight:700;color:" + (isServed ? "var(--success)" : "var(--text-muted)") + ";'>" + m.total_beli_bulan_ini + "</td>" +
        "<td style='text-align:center;font-weight:700;'>" + m.total_beli_kumulatif + "</td>" +
        "<td>" + (m.tgl_terakhir_beli || "-") + "</td>" +
        "<td>" + statusBadge + "</td>";
      tbody.appendChild(tr);
    });
  }

  function filterReportTable() {
    var query = document.getElementById("report-search").value.toLowerCase().trim();
    var filterStatus = document.getElementById("report-filter-status").value;

    var filtered = allMembersCache.filter(function (m) {
      var matchSearch = m.nama_lengkap.toLowerCase().includes(query) ||
        m.id_anggota.toLowerCase().includes(query) ||
        m.rt_rw.toLowerCase().includes(query);
      var matchStatus = true;
      if (filterStatus === "UNSERVED") matchStatus = (m.total_beli_bulan_ini === 0);
      if (filterStatus === "SERVED") matchStatus = (m.total_beli_bulan_ini > 0);
      return matchSearch && matchStatus;
    });

    renderReportTable(filtered);
  }

  function exportReportToCSV() {
    let csv = "ID Anggota,Nama Lengkap,NIK,RT/RW,No WA,Status,Beli Bulan Ini,Total Kumulatif,Terakhir Beli\n";
    allMembersCache.forEach(m => {
      csv += `"${m.id_anggota}","${m.nama_lengkap}","${m.no_ktp}","${m.rt_rw}","${m.no_whatsapp}","${m.status_aktif}",${m.total_beli_bulan_ini},${m.total_beli_kumulatif},"${m.tgl_terakhir_beli}"\n`;
    });

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Rekap_Gas_${(appSettings.NAMA_KOPERASI || "Koperasi").replace(/[^a-z0-9]+/gi, "_")}_${new Date().toISOString().split("T")[0]}.csv`;
    link.click();
  }

  function loadMembersData() {

  }

  function memberAutocompleteLabel(member) {
    return member.nama_lengkap + " [" + member.id_anggota + "]";
  }

  function fillMemberAutocompleteDatalist(members) {
    const datalist = document.getElementById("member-autocomplete-options");
    if (!datalist) return;
    datalist.textContent = "";
    (members || []).slice().sort(function (a, b) {
      return a.nama_lengkap.toLowerCase().localeCompare(b.nama_lengkap.toLowerCase(), "id") || a.id_anggota.localeCompare(b.id_anggota);
    }).forEach(function (member) {
      const option = document.createElement("option");
      option.value = memberAutocompleteLabel(member);
      datalist.appendChild(option);
    });
  }

  function loadPendingSalesImports() {
    if (!isAdmin || !getAdminToken()) return;
    appScript.run
      .withSuccessHandler(renderPendingSalesImports)
      .withFailureHandler(function (err) {
        const host = document.getElementById("sales-pending-list");
        if (host) host.textContent = err.message || "Gagal memuat transaksi pending.";
      })
      .getPendingSalesImports(getAdminToken());
  }

  function renderPendingSalesImports(pending) {
    const host = document.getElementById("sales-pending-list");
    if (!host) return;
    host.textContent = "";
    if (!pending || !pending.length) {
      host.textContent = "Tidak ada penjualan yang menunggu mapping.";
      return;
    }

    fillMemberAutocompleteDatalist(allMembersCache);
    const table = document.createElement("table");
    table.className = "data-table";
    const head = document.createElement("thead");
    const headerRow = document.createElement("tr");
    ["Tanggal", "Pelanggan sumber", "Tabung", "Batch", "Pilih anggota", "Aksi"].forEach(function (label) {
      const th = document.createElement("th");
      th.textContent = label;
      headerRow.appendChild(th);
    });
    head.appendChild(headerRow);
    table.appendChild(head);
    const body = document.createElement("tbody");
    pending.forEach(function (item) {
      const row = document.createElement("tr");
      [item.tgl_waktu_transaksi, item.nama_sumber, String(item.jumlah_tabung), item.id_batch].forEach(function (value) {
        const td = document.createElement("td");
        td.textContent = value || "-";
        row.appendChild(td);
      });
      const choiceCell = document.createElement("td");
      const input = document.createElement("input");
      input.className = "input-text pending-member-choice";
      input.type = "text";
      input.setAttribute("list", "member-autocomplete-options");
      input.dataset.transactionId = item.id_transaksi;
      input.placeholder = "Ketik nama anggota...";
      input.setAttribute("aria-label", "Pilih anggota untuk " + item.nama_sumber);
      choiceCell.appendChild(input);
      row.appendChild(choiceCell);

      const actionCell = document.createElement("td");
      const mapButton = document.createElement("button");
      mapButton.className = "btn btn-primary btn-sm";
      mapButton.type = "button";
      mapButton.textContent = "Petakan";
      mapButton.addEventListener("click", function () { mapPendingSalesImport(item.id_transaksi, input.value); });
      const deleteButton = document.createElement("button");
      deleteButton.className = "btn btn-outline btn-sm";
      deleteButton.type = "button";
      deleteButton.textContent = "Hapus";
      deleteButton.style.marginLeft = "6px";
      deleteButton.addEventListener("click", function () { removePendingSalesImport(item.id_transaksi, item.nama_sumber); });
      actionCell.appendChild(mapButton);
      actionCell.appendChild(deleteButton);
      row.appendChild(actionCell);
      body.appendChild(row);
    });
    table.appendChild(body);
    host.appendChild(table);
  }

  function findMemberByAutocompleteLabel(label) {
    const normalized = String(label || "").trim();
    return allMembersCache.find(function (member) { return memberAutocompleteLabel(member) === normalized; }) || null;
  }

  function mapPendingSalesImport(transactionId, selectedLabel) {
    const member = findMemberByAutocompleteLabel(selectedLabel);
    if (!member) {
      showToast("Pilih nama dari saran autocomplete agar anggota teridentifikasi dengan benar.", true);
      return;
    }
    appScript.run
      .withSuccessHandler(function (res) {
        showToast(res.message || "Transaksi berhasil dipetakan.");
        loadPendingSalesImports();
        loadMembersData();
        loadDashboardData();
        loadPublicData();
      })
      .withFailureHandler(function (err) { showToast(err.message || "Mapping transaksi gagal.", true); })
      .resolvePendingSalesImport(transactionId, member.id_anggota, getAdminToken());
  }

  function removePendingSalesImport(transactionId, customerName) {
    if (!confirm("Hapus transaksi pending milik " + customerName + "? Stok batch terkait juga akan dikoreksi.")) return;
    appScript.run
      .withSuccessHandler(function (res) {
        showToast(res.message || "Transaksi pending dihapus.");
        loadPendingSalesImports();
        loadBatches();
        loadDashboardData();
        loadPublicData();
      })
      .withFailureHandler(function (err) { showToast(err.message || "Penghapusan transaksi gagal.", true); })
      .deletePendingSalesImport(transactionId, getAdminToken());
  }

  function renderMemberTable(members) {
    const tbody = document.getElementById("member-table-body");
    tbody.innerHTML = "";

    if (!members || members.length === 0) {
      tbody.innerHTML = "<tr><td colspan='8' style='text-align:center; padding:20px;'>Belum ada data anggota.</td></tr>";
      return;
    }

    members.forEach(m => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>${m.id_anggota}</strong></td>
        <td style="font-weight: 600;">${m.nama_lengkap}</td>
        <td>${m.no_ktp || "-"}</td>
        <td>${m.rt_rw}</td>
        <td>${m.no_whatsapp || "-"}</td>
        <td><span class="kpi-badge ${m.status_aktif === 'AKTIF' ? 'badge-success' : 'badge-primary'}">${m.status_aktif}</span></td>
        <td style="text-align: center; font-weight: 700;">${m.total_beli_kumulatif}</td>
        <td>
          <button class="btn btn-outline btn-sm" onclick="openEditMemberModal('${m.id_anggota}')">Edit</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function filterMemberTable() {
    const query = document.getElementById("member-search").value.toLowerCase().trim();
    const filterStatus = document.getElementById("member-filter-status").value;

    const filtered = allMembersCache.filter(m => {
      const matchSearch = m.nama_lengkap.toLowerCase().includes(query) ||
        m.no_ktp.toLowerCase().includes(query) ||
        m.id_anggota.toLowerCase().includes(query) ||
        m.rt_rw.toLowerCase().includes(query);

      let matchStatus = true;
      if (filterStatus !== "ALL") matchStatus = (m.status_aktif === filterStatus);

      return matchSearch && matchStatus;
    });

    renderMemberTable(filtered);
  }

  function openAddMemberModal() {
    document.getElementById("modal-member-title").textContent = "Tambah Anggota Baru";
    document.getElementById("form-member-id").value = "";
    document.getElementById("form-member-name").value = "";
    document.getElementById("form-member-nik").value = "";
    document.getElementById("form-member-rt").value = "";
    document.getElementById("form-member-wa").value = "";
    document.getElementById("form-member-status").value = "AKTIF";
    openModal("modal-member");
  }

  function openEditMemberModal(memberId) {
    const m = allMembersCache.find(x => x.id_anggota === memberId);
    if (!m) return;

    document.getElementById("modal-member-title").textContent = `Edit Anggota (${memberId})`;
    document.getElementById("form-member-id").value = m.id_anggota;
    document.getElementById("form-member-name").value = m.nama_lengkap;
    document.getElementById("form-member-nik").value = m.no_ktp;
    document.getElementById("form-member-rt").value = m.rt_rw;
    document.getElementById("form-member-wa").value = m.no_whatsapp;
    document.getElementById("form-member-status").value = m.status_aktif;
    openModal("modal-member");
  }

  function saveMemberForm() {
    const memberId = document.getElementById("form-member-id").value;
    const data = {
      nama_lengkap: document.getElementById("form-member-name").value,
      no_ktp: document.getElementById("form-member-nik").value,
      rt_rw: document.getElementById("form-member-rt").value,
      no_whatsapp: document.getElementById("form-member-wa").value,
      status_aktif: document.getElementById("form-member-status").value
    };

    if (!data.nama_lengkap) {
      alert("Nama lengkap wajib diisi.");
      return;
    }

    if (memberId) {
      // Update — sertakan token untuk validasi server
      data.sessionToken = getAdminToken();
      appScript.run
        .withSuccessHandler(function (res) {
          closeModal("modal-member");
          showToast(res.message);
          loadMembersData();
        })
        .withFailureHandler(function (err) {
          showToast(err.message, true);
        })
        .updateMember(memberId, data);
    } else {
      // Add — sertakan token untuk validasi server
      data.sessionToken = getAdminToken();
      appScript.run
        .withSuccessHandler(function (res) {
          closeModal("modal-member");
          showToast(res.message);
          loadMembersData();
        })
        .withFailureHandler(function (err) {
          showToast(err.message, true);
        })
        .addMember(data);
    }
  }

  function confirmResetMonth() {
    if (confirm("Apakah Anda yakin ingin mereset kuota bulanan? Kolom 'total_beli_bulan_ini' akan di-set menjadi 0 untuk semua anggota agar giliran bulan baru dimulai.")) {
      showToast("Sedang mereset kuota bulanan...");
      appScript.run
        .withSuccessHandler(function (res) {
          showToast(res.message);
          loadMembersData();
          loadDashboardData();
          loadPublicData();
        })
        .withFailureHandler(function (err) {
          showToast(err.message, true);
        })
        .resetMonthlyQuota(getAdminToken());
    }
  }

  function importFromReference() {
    if (confirm("Salin data anggota warga Desa Gulun dari sheet 'template_simkopdes' ke dalam database? Data referensi asli tidak akan diubah.")) {
      showToast("Sedang membaca & menyalin data dari sheet template_simkopdes...");
      appScript.run
        .withSuccessHandler(function (res) {
          showToast(res.message);
          loadMembersData();
          loadDashboardData();
          loadPublicData();
        })
        .withFailureHandler(function (err) {
          showToast(err.message, true);
        })
        .importMembersFromReference(null, "template_simkopdes", getAdminToken());
    }
  }

  function initSalesImportControls() {
    const fileInput = document.getElementById("sales-import-file");
    const priceInput = document.getElementById("sales-import-price");
    if (fileInput) fileInput.addEventListener("change", resetSalesImportPreview);
    if (priceInput) priceInput.addEventListener("input", function () {
      document.getElementById("sales-import-price-confirm").checked = false;
      updateSalesImportButton();
    });
  }

  function resetSalesImportPreview() {
    salesImportState = null;
    document.getElementById("sales-import-preview").style.display = "none";
    document.getElementById("sales-import-result").textContent = "";
    document.getElementById("sales-import-price-confirm").checked = false;
    document.getElementById("sales-import-commit-button").disabled = true;
  }

  function previewSalesImport() {
    if (!isAdmin || !getAdminToken()) {
      showToast("Login admin diperlukan untuk mengimpor transaksi.", true);
      return;
    }
    const fileInput = document.getElementById("sales-import-file");
    const file = fileInput.files && fileInput.files[0];
    if (!file) {
      showToast("Pilih file JSON penjualan terlebih dahulu.", true);
      return;
    }
    if (!file.name.toLowerCase().endsWith(".json")) {
      showToast("File harus berekstensi .json.", true);
      return;
    }

    const button = document.getElementById("sales-import-preview-button");
    button.disabled = true;
    showToast("Memvalidasi file dan mencocokkan data anggota...");
    const reader = new FileReader();
    reader.onload = function () {
      const jsonText = String(reader.result || "");
      appScript.run
        .withSuccessHandler(function (res) {
          button.disabled = false;
          if (!res || !res.success) {
            showToast(res && res.message ? res.message : "Pratinjau impor gagal.", true);
            return;
          }
          salesImportState = { jsonText: jsonText, fileName: file.name, preview: res };
          renderSalesImportPreview(res);
          showToast("Pratinjau siap. Periksa harga dan pemetaan sebelum impor.");
        })
        .withFailureHandler(function (err) {
          button.disabled = false;
          showToast(err.message || "Gagal membaca pratinjau impor.", true);
        })
        .getSalesImportPreview(jsonText, file.name, getAdminToken());
    };
    reader.onerror = function () {
      button.disabled = false;
      showToast("File tidak dapat dibaca oleh browser.", true);
    };
    reader.readAsText(file, "UTF-8");
  }

  function renderSalesImportPreview(preview) {
    const summaryHost = document.getElementById("sales-import-summary");
    summaryHost.textContent = "";
    const summaryTable = document.createElement("table");
    summaryTable.className = "data-table";
    const rows = [
      ["Periode", preview.period],
      ["Pelanggan", preview.customers.length],
      ["Tabung (ringkasan / hasil jumlah baris)", preview.summary.sold + " / " + preview.summary.sold],
      ["Gross", formatSalesImportCurrency(preview.summary.gross)],
      ["Modal (informasi sumber)", formatSalesImportCurrency(preview.summary.modal)],
      ["Profit (informasi sumber)", formatSalesImportCurrency(preview.summary.profit)],
      ["Cocok otomatis", preview.counts.matched],
      ["Nama ambigu", preview.counts.ambiguous],
      ["Tidak cocok", preview.counts.unmatched],
      ["Duplikat yang akan dilewati", preview.counts.duplicates],
      ["Usulan harga per tabung", preview.suggestedPrice === null ? "Wajib diisi manual" : formatSalesImportCurrency(preview.suggestedPrice)]
    ];
    (preview.batchPlan || []).forEach(function (batch) {
      rows.push(["Estimasi batch " + batch.date + " (Jumat 16.00) · " + batch.customers + " pelanggan", batch.batchId + " · " + batch.units + " tabung"]);
    });
    const body = document.createElement("tbody");
    rows.forEach(function (row) {
      const tr = document.createElement("tr");
      const label = document.createElement("th");
      const value = document.createElement("td");
      label.textContent = row[0];
      value.textContent = String(row[1]);
      tr.appendChild(label);
      tr.appendChild(value);
      body.appendChild(tr);
    });
    summaryTable.appendChild(body);
    summaryHost.appendChild(summaryTable);

    const priceInput = document.getElementById("sales-import-price");
    priceInput.value = preview.suggestedPrice === null ? "" : String(preview.suggestedPrice);
    document.getElementById("sales-import-price-confirm").checked = false;
    renderSalesImportMappings(preview);
    document.getElementById("sales-import-preview").style.display = "block";
    updateSalesImportButton();
  }

  function renderSalesImportMappings(preview) {
    const host = document.getElementById("sales-import-mapping");
    host.textContent = "";
    fillMemberAutocompleteDatalist(preview.members);
    const unresolved = preview.customers.filter(function (customer) {
      return !customer.duplicate && customer.matchStatus !== "matched_nik" && customer.matchStatus !== "matched_name";
    });
    if (!unresolved.length) {
      host.textContent = "Semua pelanggan yang belum menjadi duplikat cocok otomatis; tidak ada pemetaan manual.";
      return;
    }

    const table = document.createElement("table");
    table.className = "data-table";
    const thead = document.createElement("thead");
    const headingRow = document.createElement("tr");
    ["Pelanggan sumber", "Tabung", "Status pencocokan", "Pilih anggota bila diketahui"].forEach(function (text) {
      const th = document.createElement("th");
      th.textContent = text;
      headingRow.appendChild(th);
    });
    thead.appendChild(headingRow);
    table.appendChild(thead);
    const body = document.createElement("tbody");
    unresolved.forEach(function (customer) {
      const row = document.createElement("tr");
      const name = document.createElement("td");
      const quantity = document.createElement("td");
      const status = document.createElement("td");
      const choiceCell = document.createElement("td");
      const input = document.createElement("input");
      input.className = "input-text import-member-choice";
      input.type = "text";
      input.setAttribute("list", "member-autocomplete-options");
      input.dataset.customerReportId = customer.customerReportId;
      input.placeholder = "Ketik nama anggota...";
      input.setAttribute("aria-label", "Pilih anggota untuk " + customer.name);
      name.textContent = customer.name;
      quantity.textContent = String(customer.quantity);
      status.textContent = customer.matchStatus.replace(/_/g, " ");
      choiceCell.appendChild(input);
      row.appendChild(name);
      row.appendChild(quantity);
      row.appendChild(status);
      row.appendChild(choiceCell);
      body.appendChild(row);
    });
    table.appendChild(body);
    host.appendChild(table);
  }

  function formatSalesImportCurrency(value) {
    return "Rp " + Number(value || 0).toLocaleString("id-ID");
  }

  function updateSalesImportButton() {
    const price = Number(document.getElementById("sales-import-price").value);
    const confirmed = document.getElementById("sales-import-price-confirm").checked;
    document.getElementById("sales-import-commit-button").disabled = !salesImportState || !confirmed || !Number.isInteger(price) || price <= 0;
  }

  function commitSalesImport() {
    if (!salesImportState || !isAdmin || !getAdminToken()) {
      showToast("Pratinjau aktif dan sesi admin diperlukan.", true);
      return;
    }
    const unitPrice = Number(document.getElementById("sales-import-price").value);
    if (!Number.isInteger(unitPrice) || unitPrice <= 0 || !document.getElementById("sales-import-price-confirm").checked) {
      showToast("Masukkan dan konfirmasi harga historis berupa bilangan bulat positif.", true);
      return;
    }
    if (!confirm("Impor transaksi periode " + salesImportState.preview.period + " dengan harga " + formatSalesImportCurrency(unitPrice) + " per tabung? Batch dibuat per pekan Jumat pukul 16.00. Duplikat dilewati; pelanggan tanpa pemetaan disimpan untuk tindak lanjut admin.")) return;

    const decisions = {};
    document.querySelectorAll("#sales-import-mapping input[data-customer-report-id]").forEach(function (input) {
      if (!input.value.trim()) return;
      const member = (salesImportState.preview.members || []).find(function (candidate) {
        return memberAutocompleteLabel(candidate) === input.value.trim();
      });
      if (!member) {
        input.focus();
        showToast("Pilih anggota dari saran autocomplete atau kosongkan agar disimpan untuk tindak lanjut.", true);
        return;
      }
      decisions[input.dataset.customerReportId] = member.id_anggota;
    });
    const unresolvedInput = Array.from(document.querySelectorAll("#sales-import-mapping input[data-customer-report-id]")).some(function (input) {
      return input.value.trim() && !decisions[input.dataset.customerReportId];
    });
    if (unresolvedInput) return;
    const button = document.getElementById("sales-import-commit-button");
    button.disabled = true;
    showToast("Mengimpor transaksi dan memperbarui riwayat anggota...");
    appScript.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          button.disabled = false;
          showToast(res && res.message ? res.message : "Impor transaksi gagal.", true);
          return;
        }
        const result = document.getElementById("sales-import-result");
        result.textContent = "Selesai: " + res.importedTransactions + " transaksi, " + res.importedUnits + " tabung, total " + formatSalesImportCurrency(res.totalAmount) + "; " + res.duplicateCount + " duplikat dilewati; " + (res.pendingMappingCount || 0) + " transaksi menunggu mapping admin.";
        if (res.importedBatches && res.importedBatches.length) {
          result.textContent += " Batch Jumat: " + res.importedBatches.map(function (batch) {
            return batch.batchId + " (" + batch.date + ", " + batch.units + " tabung)";
          }).join(", ") + ". Data ditandai sebagai IMPOR_HISTORIS / IMPOR JSON untuk pengecekan.";
        }
        salesImportState = null;
        document.getElementById("sales-import-preview").style.display = "none";
        document.getElementById("sales-import-file").value = "";
        loadMembersData();
        loadPendingSalesImports();
        loadDashboardData();
        loadBatches();
        loadPublicData();
        showToast("Impor data penjualan selesai.");
      })
      .withFailureHandler(function (err) {
        button.disabled = false;
        showToast(err.message || "Impor transaksi gagal.", true);
      })
      .importSalesFromJson(salesImportState.jsonText, salesImportState.fileName, unitPrice, decisions, getAdminToken());
  }

  function escapeQuotes(str) {
    if (!str) return "";
    return str.replace(/'/g, "\\'");
  }
</script>
